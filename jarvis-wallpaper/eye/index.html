<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jarvis Eye Wallpaper</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020203;font-family:"SF Mono",Consolas,monospace;color:#cfcfcc}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;bottom:5vh;text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#6c6c6a}
#hud b{color:#e8e8e4;font-weight:400}
#clock{position:fixed;left:4vw;top:5vh;font-size:clamp(32px,4vw,64px);font-weight:200;letter-spacing:.08em;color:#e8e8e4}
#tx{position:fixed;left:50%;bottom:10vh;transform:translateX(-50%);width:min(760px,60vw);text-align:center;font-family:Georgia,serif;
  font-size:clamp(16px,1.6vw,24px);color:#e8e8e4;opacity:0;transition:opacity .6s}
</style></head><body>
<canvas id="c"></canvas>
<div id="clock">00:00</div><div id="tx"></div>
<div id="hud"><span id="st">Standby</span> · <b id="lv">00</b> · click to enable mic</div>
<script>
(()=>{'use strict';
const TAU=Math.PI*2,S={gain:1,accent:'#ffffff',speed:1};
let acc=[255,255,255];const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(a,c)=>{c=c||acc;return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR,cx,cy,R;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cx=W/2;cy=H/2;R=Math.min(W,H)*.3;}
addEventListener('resize',rs);rs();

/* audio */
let an=null,tb,fb,env=0,ext=0;const N=180,spec=new Float32Array(N),wave=new Float32Array(N);
const hist=[];for(let i=0;i<9;i++)hist.push(new Float32Array(N));let hT=0;
async function mic(){if(an)return;try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.6;
  ac.createMediaStreamSource(st).connect(an);tb=new Uint8Array(1024);fb=new Uint8Array(512);ac.resume&&ac.resume();sr();}catch(e){}}
mic();addEventListener('click',mic);
window.livelyAudioListener=a=>{ext=performance.now();for(let i=0;i<N;i++)spec[i]=Math.max(spec[i],Math.min(1,(a[(i*64/N)|0]||0)*S.gain));};
function readAudio(T,now){let rms=.004;
  if(an){an.getByteTimeDomainData(tb);an.getByteFrequencyData(fb);let s=0;for(let i=0;i<1024;i++){const v=(tb[i]-128)/128;s+=v*v;}rms=Math.sqrt(s/1024)*S.gain;
    for(let i=0;i<N;i++){const f=2+Math.pow(i/N,1.6)*90,lo=f|0,raw=(fb[lo]*(1-(f-lo))+fb[lo+1]*(f-lo))/255;
      const t=Math.min(1,Math.max(0,raw-.15)*1.7*S.gain);spec[i]+=(t-spec[i])*(t>spec[i]?.6:.12);
      wave[i]+=(((tb[(i*1024/N)|0]-128)/128*S.gain)-wave[i])*.5;}}
  else if(now-ext>500){for(let i=0;i<N;i++){const t=.04+.03*Math.sin(T*1.3+i*.2);spec[i]+=(t-spec[i])*.05;wave[i]=.03*Math.sin(T*2+i*.3);}}
  else{rms=.06;for(let i=0;i<N;i++){spec[i]*=.9;wave[i]=.05*Math.sin(T*8+i*.4)*spec[i]*3;}}
  const l=Math.min(1,Math.max(0,rms-.008)*7);env+=(l-env)*(l>env?.5:.05);
  if(now-hT>70){hT=now;const o=hist.pop();o.set(wave);hist.unshift(o);}}

/* transcript (Chrome/Edge) */
let txT;function sr(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  try{const r=new SR();r.continuous=true;r.interimResults=true;let dead=false;
    r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
      const el=document.getElementById('tx');el.textContent='“'+t.trim()+'”';el.style.opacity=1;clearTimeout(txT);txT=setTimeout(()=>el.style.opacity=0,3500);};
    r.onerror=e=>{if(/not-allowed|network/.test(e.error))dead=true};r.onend=()=>{if(!dead)setTimeout(()=>{try{r.start()}catch(_){}},400)};r.start();}catch(_){}}

/* particles orbiting the lens */
const P=Array.from({length:260},()=>({a:Math.random()*TAU,r:1.15+Math.random()*.9,v:(Math.random()-.5)*.0006,s:Math.random()*1.4+.3,o:Math.random()}));

let last=performance.now(),T=0,rot=0;
function frame(now){const dt=Math.min(50,now-last);last=now;T+=dt/1000;readAudio(T,now);rot+=dt*.0002*S.speed*(1+env*4);
  ctx.fillStyle='#020203';ctx.fillRect(0,0,W,H);
  // soft halo
  let g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*2.3);g.addColorStop(0,rgba(.05+env*.14));g.addColorStop(1,rgba(0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // particles
  for(const p of P){p.a+=p.v*dt*(1+env*6);const r=(p.r+spec[(p.o*N)|0]*.25)*R,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r*.98;
    ctx.fillStyle=rgba(.15+p.o*.4+env*.3);ctx.fillRect(x,y,p.s*DPR,p.s*DPR);}
  // lens body
  g=ctx.createRadialGradient(cx-R*.15,cy-R*.2,R*.1,cx,cy,R*1.05);g.addColorStop(0,'#1d1d21');g.addColorStop(.7,'#0a0a0c');g.addColorStop(1,'#030304');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  // spectrum ring: dotted bars
  ctx.lineCap='round';ctx.beginPath();
  for(let i=0;i<N*2;i++){const k=i<N?i:2*N-1-i,a=-Math.PI/2+i/(N*2)*TAU+rot,len=R*(.02+spec[k]*.22),c=Math.cos(a),s=Math.sin(a);
    ctx.moveTo(cx+c*R*1.04,cy+s*R*1.04);ctx.lineTo(cx+c*(R*1.04+len),cy+s*(R*1.04+len));}
  ctx.lineWidth=1.4*DPR;ctx.strokeStyle=rgba(.75);ctx.stroke();
  // waveform rings (history = ripples)
  ctx.globalCompositeOperation='lighter';
  for(let h=0;h<hist.length;h++){const w=hist[h],al=(1-h/hist.length)*.85,base=.92-h*.06;ctx.beginPath();
    for(let i=0;i<=N*2;i++){const ii=i%(N*2),k=ii<N?ii:2*N-1-ii,a=-Math.PI/2+ii/(N*2)*TAU,r=R*(base+w[k]*.45)*(1+h*.012);
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.lineWidth=(h?1:2)*DPR;ctx.strokeStyle=rgba(al*.8);ctx.stroke();}
  ctx.globalCompositeOperation='source-over';
  // inner lens rings + rotating glint
  for(const[rr,al]of[[.62,.25],[.5,.18],[.3,.3]]){ctx.strokeStyle=rgba(al);ctx.lineWidth=DPR;ctx.beginPath();ctx.arc(cx,cy,R*rr,0,TAU);ctx.stroke();}
  ctx.strokeStyle=rgba(.9);ctx.lineWidth=2*DPR;ctx.beginPath();ctx.arc(cx,cy,R*.62,rot*3,rot*3+.7);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*.62,rot*3+Math.PI,rot*3+Math.PI+.25);ctx.stroke();
  // iris dot that expands with voice
  g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*(.12+env*.22));g.addColorStop(0,rgba(.95));g.addColorStop(.35,rgba(.25));g.addColorStop(1,rgba(0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*(.12+env*.22),0,TAU);ctx.fill();
  ctx.strokeStyle=rgba(.95);ctx.lineWidth=2*DPR;ctx.beginPath();ctx.arc(cx,cy,R*.045,0,TAU);ctx.stroke();
  // specular highlight on glass
  ctx.strokeStyle=rgba(.35);ctx.lineWidth=DPR;ctx.beginPath();ctx.arc(cx,cy,R*.97,-2.6,-1.7);ctx.stroke();
  document.getElementById('st').textContent=env>.12?'Listening':'Standby';document.getElementById('lv').textContent=String(Math.round(env*100)).padStart(2,'0');
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},1000);
window.livelyPropertyListener=(n,v)=>{if(n==='accent'){acc=hex(v)}else if(n==='gain')S.gain=+v;else if(n==='speed')S.speed=+v;};
})();
</script></body></html>
