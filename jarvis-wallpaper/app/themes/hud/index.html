<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis HUD Wallpaper</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--accent:rgb(217,119,87);--cream:#f0eee6;--dim:#8a8378}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e0c0a;
    font-family:"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;color:var(--cream)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;z-index:2;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none}
  .hud b{color:var(--cream);font-weight:500}
  #clock{left:4vw;top:5vh}
  #clock .t{font-size:clamp(40px,5vw,84px);letter-spacing:.04em;color:var(--cream);font-weight:300;line-height:1}
  #clock .t i{font-style:normal;color:var(--accent);animation:blink 1s steps(2) infinite}
  #clock .d{margin-top:10px}
  #greet{left:4vw;bottom:5vh}
  #greet .g{font-size:clamp(16px,1.6vw,26px);color:var(--cream);letter-spacing:.06em;text-transform:none;font-family:Georgia,serif}
  #greet .s{margin-top:8px}
  #stats{right:4vw;top:5vh;width:min(240px,20vw)}
  .row{margin-bottom:14px}.row .l{display:flex;justify-content:space-between;margin-bottom:6px}
  .bar{height:3px;background:rgba(240,238,230,.1);position:relative;overflow:hidden}
  .bar>div{position:absolute;inset:0 auto 0 0;background:var(--accent);box-shadow:0 0 10px var(--accent);width:0;transition:width .8s ease}
  #log{right:4vw;bottom:5vh;width:min(300px,26vw);text-align:right;line-height:1.9;font-size:11px}
  #log div{animation:fade 6s linear forwards}
    #mic{left:50%;bottom:5vh;transform:translateX(-50%);pointer-events:auto;cursor:pointer;padding:6px 12px;border:1px solid rgba(240,238,230,.18)}
  #mic i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a544b;margin-right:8px;vertical-align:1px}
  #mic.on i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  @keyframes blink{50%{opacity:0}}
  @keyframes fade{0%{opacity:0}8%{opacity:.9}80%{opacity:.5}100%{opacity:0}}
  .scan{position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}
  @media (max-width:900px){#stats,#log{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div><div class="scan"></div>
<div class="hud" id="clock"><div class="t" id="t">00<i>:</i>00</div><div class="d" id="d"></div></div>
<div class="hud" id="greet"><div class="g" id="g"></div><div class="s">Core online · <b id="up">00:00:00</b></div></div>
<div class="hud" id="stats">
  <div class="row"><div class="l"><span>CPU</span><b id="cpuv">--</b></div><div class="bar"><div id="cpu"></div></div></div>
  <div class="row"><div class="l"><span>Memory</span><b id="ramv">--</b></div><div class="bar"><div id="ram"></div></div></div>
  <div class="row"><div class="l"><span>Network</span><b id="netv">--</b></div><div class="bar"><div id="net"></div></div></div>
  <div class="row"><div class="l"><span>Power</span><b id="batv">--</b></div><div class="bar"><div id="bat"></div></div></div>
</div>
<div class="hud" id="log"></div>
<div class="hud" id="mic"><i></i><span id="micT">Mic off · click to enable</span></div>

<script>
(() => {
'use strict';
const TAU=Math.PI*2, MONO='"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace';
const S={name:'Neelesh',speed:1,nodes:520,theme:0,tilt:.42,gain:1,core:true};
const THEMES=[
  {a:[217,119,87], b:[240,238,230], bg0:'#2a241e', bg1:'#0e0c0a'},   // Claude
  {a:[236,236,232],b:[165,165,162], bg0:'#1b1b1d', bg1:'#040405'},   // Mono
  {a:[255,122,48], b:[112,210,222], bg0:'#15262b', bg1:'#060e11'}];  // Reactor
let TH=THEMES[0];
const rgba=(a,c)=>{c=c||TH.a;return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'};
function setTheme(i){S.theme=((i%3)+3)%3;TH=THEMES[S.theme];document.documentElement.style.setProperty('--accent','rgb('+TH.a+')');}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,cx,cy,R,FOV;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cx=W/2;cy=H/2;R=Math.min(W,H)*.185;FOV=R*7;}
addEventListener('resize',resize);resize();

/* ================= AUDIO ================= */
const spec=new Float32Array(128), tg=new Float32Array(128), wv=new Float32Array(128), wvT=new Float32Array(128);
const au={env:0,bass:0,mid:0,treb:0,voice:false,src:'idle'};
let ac=null,an=null,tb=null,fb=null,extT=0; const ext=new Float32Array(128);
let voiceHold=0;
async function startMic(){
  if(an){ac&&ac.resume&&ac.resume();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:true}});
    ac=new (window.AudioContext||window.webkitAudioContext)();
    an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.6;
    ac.createMediaStreamSource(st).connect(an);
    tb=new Uint8Array(an.fftSize);fb=new Uint8Array(an.frequencyBinCount);
    ac.resume&&ac.resume();
    micUI(true);logLine('Microphone linked');
  }catch(e){micUI(false,'Mic blocked · click to retry');}
}
function micUI(on,msg){const m=document.getElementById('mic');m.classList.toggle('on',on);
  document.getElementById('micT').textContent=msg||(on?'Listening':'Mic off · click to enable');}
document.getElementById('mic').addEventListener('click',startMic);
/* Lively Wallpaper feeds system-audio FFT (128 floats) here; used when no mic */
window.livelyAudioListener=function(a){extT=performance.now();for(let i=0;i<128;i++)ext[i]=a[i>>1]||0;};

function updateAudio(dt,T,now){
  let rms=0;
  if(an){
    an.getByteTimeDomainData(tb);an.getByteFrequencyData(fb);
    let s=0;for(let i=0;i<tb.length;i++){const v=(tb[i]-128)/128;s+=v*v;}rms=Math.sqrt(s/tb.length)*S.gain;
    for(let i=0;i<128;i++){const f=2*Math.pow(45,i/127),lo=f|0,fr=f-lo;
      const raw=(fb[lo]*(1-fr)+fb[lo+1]*fr)/255;tg[i]=Math.min(1,Math.max(0,raw-.15)/.85*1.5*S.gain);}
    for(let i=0;i<128;i++)wvT[i]=(tb[i*8]-128)/128*S.gain;
    au.src='mic';
  }else if(now-extT<500){
    let m=0;for(let i=0;i<128;i++){tg[i]=Math.min(1,ext[i]*S.gain);m+=tg[i];}rms=m/128*.35;
    wvT.fill(0);
    au.src='system';
  }else{
    tg.fill(0);wvT.fill(0);rms=0;au.src='idle';
  }
  const lvl=Math.min(1,Math.max(0,rms-.008)*7);
  au.env+=(lvl-au.env)*(1-Math.exp(-dt/(lvl>au.env?40:220)));
  let b=0,m=0,t=0;
  for(let i=0;i<128;i++){spec[i]+=(tg[i]-spec[i])*(tg[i]>spec[i]?.6:.12);wv[i]+=(wvT[i]-wv[i])*.5;
    if(i<16)b+=spec[i];else if(i<70)m+=spec[i];else t+=spec[i];}
  au.bass=b/16;au.mid=m/54;au.treb=t/58;
  // voice on/off with hysteresis + hold
  if(au.env>.14){if(!au.voice){au.voice=true;onVoice(true);}voiceHold=now+350;}
  else if(au.voice&&au.env<.08&&now>voiceHold){au.voice=false;onVoice(false);}
}

/* ================= CAMERA / PROJECTION ================= */
let yaw=0,pitch=S.tilt,mx=0,my=0,tmx=0,tmy=0,T=0,cp,sp,cyw,syw;
addEventListener('mousemove',e=>{tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5;});
const out=[0,0,1];
function P(x,y,z){const y1=y*cp-z*sp,z1=y*sp+z*cp,x2=x*cyw+z1*syw,z2=-x*syw+z1*cyw,f=FOV/(FOV+z2);
  out[0]=cx+x2*f;out[1]=cy+y1*f;out[2]=f;return out;}
function L(x0,y0,z0,x1,y1,z1){let p=P(x0,y0,z0);const ax=p[0],ay=p[1];p=P(x1,y1,z1);ctx.moveTo(ax,ay);ctx.lineTo(p[0],p[1]);}
function glow(lw,col,al,g){if(g){ctx.lineWidth=lw*3*DPR;ctx.strokeStyle=rgba(al*.2,col);ctx.stroke();}
  ctx.lineWidth=lw*DPR;ctx.strokeStyle=rgba(al,col);ctx.stroke();}
function ring(r,z,lw,al,col,g,a0,a1){a0=a0||0;a1=a1===undefined?TAU:a1;
  const n=Math.max(16,Math.ceil((a1-a0)/TAU*150));ctx.beginPath();
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,p=P(Math.cos(a)*r*R,Math.sin(a)*r*R,z*R);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
  glow(lw,col||TH.a,al,g);}
function ticks(r,z,n,len,rot,al,col,emph,lw){ctx.beginPath();
  for(let i=0;i<n;i++){const a=rot+i/n*TAU,c=Math.cos(a),s=Math.sin(a),l=(i%emph===0)?len*1.9:len;
    L(c*r*R,s*r*R,z*R,c*(r+l)*R,s*(r+l)*R,z*R);}
  ctx.lineWidth=(lw||1)*DPR;ctx.strokeStyle=rgba(al,col||TH.b);ctx.stroke();}
function txt(s,x,y,z,size,al,col,align){const p=P(x*R,y*R,z*R);
  ctx.font=Math.max(7,Math.round(size*DPR*p[2]))+'px '+MONO;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.fillStyle=rgba(al,col||TH.b);ctx.fillText(s,p[0],p[1]);}

/* ================= HUD LAYERS ================= */
const GL='0123456789ABCDEF<>/\\-';
const glyph=n=>{let s='';for(let i=0;i<n;i++)s+=GL[(Math.random()*GL.length)|0];return s;};
let labels=[],hexA='000000',hexB='000000';
function scramble(){labels=[];for(let i=0;i<8;i++)labels.push(glyph(3)+'\\'+glyph(2)+glyph(2));
  const h=(a,b,c)=>[a,b,c].map(i=>Math.round(Math.min(1,spec[i])*255).toString(16).toUpperCase().padStart(2,'0')).join('');hexA=h(6,30,80);hexB=h(12,50,110);}
scramble();
let scrT=0;

function grid(){ctx.beginPath();const z=1.2*R,e=7*R,st=.65*R;
  for(let k=-11;k<=11;k++){L(k*st,-e,z,k*st,e,z);L(-e,k*st,z,e,k*st,z);}
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.05+au.bass*.1,TH.b);ctx.stroke();}

function spectrumRing(){const r0=1.55,n=256;ctx.beginPath();
  for(let k=0;k<n;k++){const idx=k<128?k:255-k,a=-Math.PI/2+k/n*TAU+T*.02,
    len=.035+spec[idx]*.42,c=Math.cos(a),s=Math.sin(a);L(c*r0*R,s*r0*R,0,c*(r0+len)*R,s*(r0+len)*R,0);}
  glow(2,TH.a,.9,true);
  ctx.setLineDash([2*DPR,7*DPR]);ring(r0-.035,0,1.5,.6,TH.a,false);ctx.setLineDash([]);
  ring(r0-.08,0,1,.25,TH.b,false);}

function waveRing(){const n=256;
  for(let pass=0;pass<2;pass++){ctx.beginPath();const k=pass?1.06:1,amp=pass?.22:.34;
    for(let i=0;i<=n;i++){const ii=i%n,idx=ii<128?ii:255-ii,a=-Math.PI/2+ii/n*TAU,
      r=(1.0+wv[idx]*amp*3)*k,p=P(Math.cos(a)*r*R,Math.sin(a)*r*R,(pass?.04:0)*R);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    glow(pass?1:1.6,TH.b,pass?.35:.95,!pass);}}

function gaugeRing(){const r=1.3,z=-.1,a0=.75*Math.PI,sw=1.5*Math.PI;
  ring(r,z,8,.1,TH.b,false,a0,a0+sw);
  ring(r,z,8,.95,TH.a,true,a0,a0+sw*Math.max(.012,au.env));
  ctx.beginPath();for(let i=0;i<=30;i++){const a=a0+sw*i/30,c=Math.cos(a),s=Math.sin(a);
    L(c*(r+.075)*R,s*(r+.075)*R,z*R,c*(r+(i%5?.1:.13))*R,s*(r+(i%5?.1:.13))*R,z*R);}
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.45,TH.b);ctx.stroke();
  txt(String(Math.round(au.env*100)).padStart(2,'0'),0,1.36,z,24,.95,TH.a);
  txt('INPUT LEVEL',0,1.5,z,8,.45,TH.b);}

function outerRings(){
  ring(2.3,0,1,.3,TH.b,false);
  ticks(2.12,0,180,.05,T*.015,.35,TH.b,5);
  ring(2.07,0,1,.2,TH.b,false);
  const rot=T*.12*S.speed+au.env*.6;
  for(let j=0;j<6;j++){const a0=rot+j*TAU/6;ring(2.0,0,4,.5+au.treb*.5,TH.a,true,a0,a0+.77);
    ring(1.9,0,1,.25,TH.b,false,a0+.1,a0+.6);}
  // compass spokes + scrambled labels
  ctx.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*TAU/8,c=Math.cos(a),s=Math.sin(a);L(c*2.3*R,s*2.3*R,0,c*2.46*R,s*2.46*R,0);}
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.6,TH.b);ctx.stroke();
  for(let i=0;i<8;i++){const a=-Math.PI/2+i*TAU/8,c=Math.cos(a),s=Math.sin(a);
    const al=au.voice?.9:.5,col=au.voice?TH.a:TH.b;
    if(i===0){txt(au.voice?'VOICE DETECTED':'SENSORY SIGNAL',0,-2.62,0,10,.95,col);}
    else txt('<'+labels[i]+'>',c*2.62,s*2.62*1.0,0,8,al,col,c>.3?'left':c<-.3?'right':'center');}
}

function innerRings(){
  ticks(.82,0,90,.04,-T*.05*(1+au.env*5),.4,TH.b,5);
  ctx.setLineDash([3*DPR,6*DPR]);ring(.88,0,1,.3,TH.b,false);ctx.setLineDash([]);
  // radial burst (treble reactive)
  ctx.beginPath();for(let i=0;i<48;i++){const a=i/48*TAU+T*.04,c=Math.cos(a),s=Math.sin(a),
    l=.05+spec[(i*2+20)%128]*.32;L(c*.62*R,s*.62*R,0,c*(.62+l)*R,s*(.62+l)*R,0);}
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.55,TH.b);ctx.stroke();
  // crosshair
  ctx.beginPath();for(const sg of[-1,1]){L(sg*.2*R,0,0,sg*.6*R,0,0);L(0,sg*.2*R,0,0,sg*.6*R,0);
    L(sg*.6*R,-.04*R,0,sg*.6*R,.04*R,0);L(-.04*R,sg*.6*R,0,.04*R,sg*.6*R,0);}
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.6,TH.b);ctx.stroke();}

function panel(side){const x0=2.46*side,x1=2.95*side,x2=4.15*side,z=-.12,h=.5;
  ctx.beginPath();L(x0*R,0,0,x1*R,0,z*R);L(x1*R,-h*R,z*R,x1*R,h*R,z*R);
  L(x1*R,-h*R,z*R,x2*R,-h*R,z*R);L(x1*R,h*R,z*R,x2*R,h*R,z*R);
  for(const y of[-h,h])L(x1*R-3*DPR*side,y*R,z*R,x1*R+3*DPR*side,y*R,z*R);
  ctx.lineWidth=DPR;ctx.strokeStyle=rgba(.55,TH.b);ctx.stroke();
  const al=side<0?'right':'left',tx=x1+side*.12;
  txt(side<0?'LEFT XYZ':'RIGHT XYZ',tx,-.33,z,10,.85,TH.b,al);
  txt(side<0?hexA:hexB,tx,-.12,z,10,.5,TH.b,al);
  txt(au.voice?'ENGAGED':'ENGAGE SYSTEMS',tx,.1,z,9,au.voice?.95:.55,au.voice?TH.a:TH.b,al);
  ctx.beginPath();for(let i=0;i<10;i++){const bx=x1+side*(.14+i*.1),hh=.03+spec[(i*9+(side>0?4:0))%128]*.17;
    L(bx*R,.42*R,z*R,bx*R,(.42-hh)*R,z*R);}
  ctx.lineWidth=3*DPR;ctx.lineCap='butt';ctx.strokeStyle=rgba(.85,TH.a);ctx.stroke();ctx.lineCap='round';}

/* ================= BRAIN CORE ================= */
let nodes=[],edges=[],adj=[],pulses=[],by=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function build(){nodes=[];edges=[];adj=[];pulses=[];
  while(nodes.length<S.nodes){
    const u=Math.random()*2-1,th=Math.random()*TAU,s=Math.sqrt(1-u*u),dx=s*Math.cos(th),dy=u,dz=s*Math.sin(th);
    const hemi=Math.random()<.5?-1:1,shell=Math.random()<.72?rnd(.93,1):rnd(.35,.9);
    const fold=1+.07*Math.sin(dx*9+dz*7)*Math.cos(dy*8+dz*5)+.04*Math.sin(dz*14+dy*6);
    let x=dx*.62*shell*fold,y=dy*.78*shell*fold,z=dz*shell*fold;
    if(y<0)y*=.72;if(y<-.3&&z>.25&&z<.6&&shell>.9)continue;
    x=hemi*(Math.abs(x)+.05);
    nodes.push({x:x*1.05,y:-y,z:z,glow:0,px:0,py:0,pz:0,bin:(Math.random()*128)|0});}
  const seen=new Set();
  nodes.forEach((a,i)=>{const ds=[];
    for(let j=0;j<nodes.length;j++){if(i===j)continue;const b=nodes[j];ds.push([(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2,j]);}
    ds.sort((p,q)=>p[0]-q[0]);
    for(let k=0;k<3;k++){const d=ds[k][0],j=ds[k][1];if(d>.34*.34)continue;
      const key=i<j?i+'_'+j:j+'_'+i;if(seen.has(key))continue;seen.add(key);
      edges.push({a:i,b:j});(adj[i]||(adj[i]=[])).push(edges.length-1);(adj[j]||(adj[j]=[])).push(edges.length-1);}});}
build();
function seed(){if(edges.length)pulses.push({e:(Math.random()*edges.length)|0,from:null,t:0,sp:rnd(.012,.03)});}
function drawCore(dt,now){
  by+=dt*.00022*S.speed;const c=Math.cos(by),s=Math.sin(by),k=.54*(1+au.env*.12);
  for(const n of nodes){const x=n.x*c+n.z*s,z=-n.x*s+n.z*c,p=P(x*k*R,n.y*k*R,z*k*R);
    n.px=p[0];n.py=p[1];n.pz=z;if(n.glow>0)n.glow=Math.max(0,n.glow-dt*.0022);}
  for(let i=0;i<8;i++){const n=nodes[(Math.random()*nodes.length)|0],g=spec[n.bin];if(g>.3)n.glow=Math.max(n.glow,g);}
  ctx.lineWidth=DPR;
  for(const e of edges){const a=nodes[e.a],b=nodes[e.b];
    ctx.strokeStyle=rgba(.05+((a.pz+b.pz)/2+1)*.1+au.env*.08);ctx.beginPath();ctx.moveTo(a.px,a.py);ctx.lineTo(b.px,b.py);ctx.stroke();}
  for(const n of nodes){const dep=(n.pz+1)/2,r=(1+dep*1.4+n.glow*3)*DPR*1.1,col=n.glow>.05?TH.b:TH.a;
    ctx.fillStyle=rgba(.25+dep*.5+n.glow*.4,col);ctx.beginPath();ctx.arc(n.px,n.py,r,0,TAU);ctx.fill();
    if(n.glow>.4){ctx.fillStyle=rgba(n.glow*.15);ctx.beginPath();ctx.arc(n.px,n.py,r*4,0,TAU);ctx.fill();}}
  ctx.globalCompositeOperation='lighter';
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=p.sp*(dt/16)*(1+au.env*2);
    const e=edges[p.e];let a=nodes[e.a],b=nodes[e.b],ib=e.b;if(p.from===e.b){[a,b]=[b,a];ib=e.a;}
    if(p.t>=1){b.glow=1;pulses.splice(i,1);const o=(adj[ib]||[]).filter(q=>q!==p.e);
      if(o.length&&pulses.length<70){const br=Math.random()<.2+au.env*.2?2:1;for(let q=0;q<br;q++)pulses.push({e:o[(Math.random()*o.length)|0],from:ib,t:0,sp:rnd(.012,.03)});}continue;}
    const x=a.px+(b.px-a.px)*p.t,y=a.py+(b.py-a.py)*p.t,t0=Math.max(0,p.t-.25),tx=a.px+(b.px-a.px)*t0,ty=a.py+(b.py-a.py)*t0;
    const g=ctx.createLinearGradient(tx,ty,x,y);g.addColorStop(0,rgba(0,TH.b));g.addColorStop(1,rgba(.95,TH.b));
    ctx.strokeStyle=g;ctx.lineWidth=2*DPR;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle=rgba(.3);ctx.beginPath();ctx.arc(x,y,3*DPR,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  if(pulses.length<10+au.env*45&&Math.random()<.2+au.env*.5)seed();
  // centre "O" (expands with voice)
  ring(.1+au.env*.14,0,2,.9,TH.b,true);}
function onVoice(on){if(on){for(let i=0;i<6;i++)seed();logLine('Voice input detected');}else logLine('Input idle');}

/* ================= DUST / MAIN LOOP ================= */
const dust=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),z:Math.random(),v:rnd(2e-5,8e-5)}));
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;T+=dt/1000;
  updateAudio(dt,T,now);
  if(now-scrT>(au.voice?70:1000)){scramble();scrT=now;}
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.7);
  bg.addColorStop(0,TH.bg0);bg.addColorStop(1,TH.bg1);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const d of dust){d.y-=d.v*(.4+d.z);if(d.y<0){d.y=1;d.x=Math.random();}
    ctx.fillStyle=rgba(.1+d.z*.25,TH.b);ctx.fillRect(d.x*W,d.y*H,(1+d.z)*DPR,(1+d.z)*DPR);}
  // centre glow reacts to voice
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,R*2.2);gr.addColorStop(0,rgba(.1+au.env*.28));gr.addColorStop(1,rgba(0));
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;
  yaw=mx*.7+Math.sin(T*.22)*.1;pitch=S.tilt+my*.3+au.env*.06*Math.sin(T*30);
  cp=Math.cos(pitch);sp=Math.sin(pitch);cyw=Math.cos(yaw);syw=Math.sin(yaw);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([]);
  grid();outerRings();
  ctx.globalCompositeOperation='lighter';spectrumRing();ctx.globalCompositeOperation='source-over';
  gaugeRing();
  ctx.globalCompositeOperation='lighter';waveRing();ctx.globalCompositeOperation='source-over';
  innerRings();panel(-1);panel(1);
  if(S.core)drawCore(dt,now);
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ================= TEXT HUD ================= */
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),start=Date.now();
function tick(){const d=new Date();$('t').innerHTML=pad(d.getHours())+'<i>:</i>'+pad(d.getMinutes());
  $('d').innerHTML='<b>'+d.toLocaleDateString(undefined,{weekday:'long'})+'</b> · '+d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
  const h=d.getHours(),part=h<5?'night':h<12?'morning':h<17?'afternoon':'evening';$('g').textContent='Good '+part+', '+S.name+'.';
  const u=Math.floor((Date.now()-start)/1000);$('up').textContent=pad(Math.floor(u/3600))+':'+pad(Math.floor(u/60)%60)+':'+pad(u%60);}
setInterval(tick,1000);tick();
const live={cpu:null,ram:null,net:null};
function setBar(id,v,t){$(id).style.width=Math.max(0,Math.min(100,v))+'%';$(id+'v').textContent=t||Math.round(v)+'%';}
window.livelySystemInformation=function(raw){try{const d=typeof raw==='string'?JSON.parse(raw):raw;
  if(typeof d.currentCpu==='number')live.cpu=d.currentCpu;
  if(d.totalRam&&d.currentRamUsed!==undefined)live.ram=d.currentRamUsed/d.totalRam*100;
  if(typeof d.currentNetDown==='number')live.net=d.currentNetDown;}catch(e){}};
setInterval(()=>{if(live.cpu!=null)setBar('cpu',live.cpu);if(live.ram!=null)setBar('ram',live.ram);
  if(live.net!=null)setBar('net',Math.min(100,live.net*10),live.net.toFixed(1)+' MB/s');},1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>setBar('bat',b.level*100,Math.round(b.level*100)+'%'+(b.charging?' ⚡':''));
  u();b.addEventListener('levelchange',u);b.addEventListener('chargingchange',u);});else{}
function logLine(m){const el=document.createElement('div');el.textContent='> '+m+' · '+new Date().toLocaleTimeString([],{hour12:false});
  const box=$('log');box.appendChild(el);while(box.children.length>5)box.firstChild.remove();setTimeout(()=>el.remove(),6000);}

/* ---- keys & Lively properties ---- */
addEventListener('keydown',e=>{if(e.key==='1')setTheme(0);else if(e.key==='2')setTheme(1);else if(e.key==='3')setTheme(2);
  else if(e.key==='m'||e.key==='M')startMic();else if(e.key==='b'||e.key==='B')S.core=!S.core;});
window.livelyPropertyListener=function(n,v){
  if(n==='theme')setTheme(+v);else if(n==='userName'){S.name=v;tick();}else if(n==='speed')S.speed=+v;
  else if(n==='nodes'){S.nodes=+v;build();}else if(n==='gain')S.gain=+v;else if(n==='core')S.core=!!v;else if(n==='tilt')S.tilt=+v;};
const q=new URLSearchParams(location.search);if(q.has('theme'))setTheme(+q.get('theme'));setTheme(S.theme);
logLine('Neural core online');micUI(false);startMic();
})();
</script>
