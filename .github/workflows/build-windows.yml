name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/eloquent-einstein-ljiepr']
    paths: ['jarvis-wallpaper/app/**', '.github/workflows/build-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: jarvis-wallpaper/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Wallpaper-Setup
          path: jarvis-wallpaper/app/dist/*.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: jarvis-wallpaper/app/dist/*.exe }
