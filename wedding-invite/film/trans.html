<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#M{background:#000}</style></head><body><canvas id="O" width="1080" height="1920"></canvas><canvas id="M" width="1080" height="1920" style="display:none"></canvas>
<script>
/* Transitions. renderTrans(type,p,mode): mode "mask" shows the mask (white = incoming scene visible), mode "over" shows a transparent overlay.
   All of them use shapes already in the artwork: the cusped arch, petals, warm light, the carved doors, the lit lamp. */
const W=1080,H=1920,TAU=Math.PI*2,O=document.getElementById("O"),M=document.getElementById("M");
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, mix=(a,b,t)=>a+(b-a)*t, prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out3=x=>1-Math.pow(1-x,3), sine=x=>-(Math.cos(Math.PI*x)-1)/2;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sprites={};function glowSprite(rgb){if(sprites[rgb])return sprites[rgb];const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d"),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,`rgba(${rgb},1)`);r.addColorStop(.25,`rgba(${rgb},.5)`);r.addColorStop(.6,`rgba(${rgb},.12)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,128,128);return sprites[rgb]=c}
function glow(c,x,y,r,rgb,a){if(a<=.003)return;c.save();c.globalCompositeOperation="lighter";c.globalAlpha=clamp(a);c.drawImage(glowSprite(rgb),x-r,y-r,r*2,r*2);c.restore()}
function petal(c,x,y,s,rot,flip,c1,c2,a){c.save();c.translate(x,y);c.rotate(rot);c.scale(flip,1);c.globalAlpha=a;const g=c.createLinearGradient(0,-s,0,s);g.addColorStop(0,c1);g.addColorStop(1,c2);c.fillStyle=g;c.beginPath();c.moveTo(0,-s);c.bezierCurveTo(s*.95,-s*.55,s*.8,s*.55,0,s);c.bezierCurveTo(-s*.8,s*.55,-s*.95,-s*.55,0,-s);c.fill();c.globalAlpha=a*.35;c.strokeStyle="#fff";c.lineWidth=Math.max(.6,s*.045);c.beginPath();c.moveTo(0,-s*.78);c.lineTo(0,s*.66);c.stroke();c.restore()}
const PAL={marigold:[["#f6a21e","#e0701a"],["#f9c04b","#ee8d22"],["#ffd36b","#f4a02a"]],rose:[["#f4b6c6","#e07f9e"],["#fbd3dc","#ee9db3"],["#f7c1cf","#d9728f"]],lotus:[["#fde3ea","#f09bb7"],["#f9c9d6","#e9789e"],["#ffeef2","#f4b1c6"]]};
let ARCH=null;
async function init(){const t=await (await fetch("assets/f2-mask2.svg")).text();ARCH=new Path2D(/d="([^"]+)"/.exec(t)[1]);window.TREADY=true}
init();
/* wavy soft edge helper: x position of a travelling front at height y */
const front=(y,p,amp,k)=>mix(-amp*2,W+amp*2,p)+Math.sin(y*k)*amp+Math.sin(y*k*2.3+1.7)*amp*.4;

window.renderTrans=function(type,p,mode){
  const m=M.getContext("2d"),o=O.getContext("2d"); m.clearRect(0,0,W,H);o.clearRect(0,0,W,H);m.fillStyle="#000";m.fillRect(0,0,W,H);
  O.style.display=mode==="over"?"block":"none";M.style.display=mode==="mask"?"block":"none";
  const e=ease(p);
  if(type==="arch"){                      // T1: the cusped palace arch opens from the centre of the frame and the next scene fills it
    const s=.03*Math.pow(1.7/.03,sine(p)),cx=541,cy=960;   // exponential growth reads as an even expansion
    const draw=(c,fill)=>{c.save();c.translate(cx,cy);c.scale(s,s);c.translate(-541,-960);c.translate(52,122);if(fill){c.fillStyle="#fff";c.fill(ARCH)}else{c.lineJoin="round";c.lineWidth=3/s;c.strokeStyle="#ffe6a8";c.shadowColor="rgba(255,200,110,.9)";c.shadowBlur=18;c.stroke(ARCH);c.lineWidth=1.2/s;c.shadowBlur=0;c.strokeStyle="#fff7e0";c.stroke(ARCH)}c.restore()};
    draw(m,true);m.fillStyle=`rgba(255,255,255,${sine(prog(p,.4,.82))})`;m.fillRect(0,0,W,H);o.globalAlpha=Math.sin(Math.PI*clamp(p*1.15))*1;draw(o,false);o.globalAlpha=1;
    glow(o,cx,cy,mix(120,900,e),"255,214,140",.5*Math.sin(Math.PI*p));
    const r=rng(5);for(let i=0;i<60;i++){const a=r()*TAU,d=mix(40,520,e)*(.5+r()),u=prog(p,.05,.95);glow(o,cx+Math.cos(a)*d*(.8+.6*r()),cy+Math.sin(a)*d*1.3,mix(5,16,r()),"255,226,160",Math.sin(Math.PI*u)*.9)}
  }
  else if(type==="petals"){               // T2: a wave of rose and marigold petals sweeps left to right and carries the next scene in with it
    const amp=70,k=.0042;
    m.fillStyle="#fff";m.beginPath();m.moveTo(-10,-10);for(let y=-10;y<=H+10;y+=12)m.lineTo(front(y,e,amp,k),y);m.lineTo(-10,H+10);m.closePath();m.filter="blur(10px)";m.fill();m.filter="none";
    const N=240,r=rng(11);
    for(let i=0;i<N;i++){const y=r()*H,lag=(r()-.35)*540,fx=front(y,e,amp,k)+lag*Math.sin(Math.PI*p)+mix(-80,120,r())*Math.sin(Math.PI*p);const s=mix(18,56,Math.pow(r(),1.6)),a=Math.sin(Math.PI*clamp(p*1.02))*mix(.55,1,r());
      const pal=(r()>.5?PAL.marigold:PAL.rose)[Math.floor(r()*3)],rot=r()*TAU+p*mix(2,6,r()),fl=Math.cos(p*mix(10,20,r())+r()*6.28);petal(o,fx,y+Math.sin(p*7+i)*22,s,rot,Math.abs(fl)<.2?.2:fl,pal[0],pal[1],a)}
    glow(o,front(H/2,e,amp,k),H/2,700,"255,224,190",.2*Math.sin(Math.PI*p));
  }
  else if(type==="light"){                // T3: light transforms one scene into the next, blooming from where the two hands will meet
    const cx=540,cy=1236,R=mix(0,1700,Math.pow(e,1.25));
    const g=m.createRadialGradient(cx,cy,Math.max(0,R-420),cx,cy,R+60);g.addColorStop(0,"#fff");g.addColorStop(.6,"#fff");g.addColorStop(1,"#000");m.fillStyle=g;m.fillRect(0,0,W,H);
    const fl=Math.sin(Math.PI*clamp(p*1.05));glow(o,cx,cy,mix(200,1500,e),"255,236,200",.9*fl);glow(o,cx,cy,mix(80,700,e),"255,252,238",.95*fl);
    o.save();o.globalCompositeOperation="lighter";o.globalAlpha=.35*fl;for(let i=0;i<12;i++){const a=i*TAU/12+p*.9,len=mix(300,1500,e);const gg=o.createLinearGradient(cx,cy,cx+Math.cos(a)*len,cy+Math.sin(a)*len);gg.addColorStop(0,"rgba(255,236,190,.9)");gg.addColorStop(1,"rgba(255,236,190,0)");o.fillStyle=gg;o.beginPath();o.moveTo(cx,cy);o.arc(cx,cy,len,a-.05,a+.05);o.closePath();o.fill()}o.restore();
    const r=rng(21);for(let i=0;i<70;i++){const a=r()*TAU,d=R*(.2+.9*r()),u=prog(p,0,1);glow(o,cx+Math.cos(a)*d,cy+Math.sin(a)*d,mix(5,15,r()),"255,236,180",Math.sin(Math.PI*u)*.9)}
  }
  else if(type==="doors"){                // T4: the carved doors part from the centre seam, a gold line runs down it, light spills through
    const half=mix(0,W/2+40,out3(p)),seam=W/2;
    m.fillStyle="#fff";m.fillRect(seam-half,0,half*2,H);
    const gl=Math.sin(Math.PI*clamp(p*1.05));
    for(const sd of [-1,1]){const x=seam+sd*half;const g=o.createLinearGradient(x,0,x+sd*-120,0);g.addColorStop(0,"rgba(255,226,160,.85)");g.addColorStop(1,"rgba(255,226,160,0)");o.globalAlpha=gl*.7;o.fillStyle=g;o.fillRect(Math.min(x,x-sd*120),0,120,H);o.globalAlpha=gl;o.fillStyle="#ffe6a8";o.shadowColor="rgba(255,200,110,.9)";o.shadowBlur=22;o.fillRect(x-1.5,0,3,H*prog(p,0,.35));o.shadowBlur=0}
    o.globalAlpha=1;glow(o,seam,H/2,mix(100,900,out3(p)),"255,222,160",.55*gl*(1-p*.6));
    const r=rng(33);for(let i=0;i<50;i++){const y=r()*H,x=seam+(r()*2-1)*half*1.05,u=prog(p,.0,1);glow(o,x,y-u*160*r(),mix(5,13,r()),"255,236,180",Math.sin(Math.PI*u)*.85)}
  }
  else if(type==="lamp"){                 // T5: the lamp inside the chhatri flares, a ring of warm light rises from the base and marigold petals lift with it
    const cx=542,cy=1665,R=mix(0,2300,Math.pow(e,1.15));
    const g=m.createRadialGradient(cx,cy,Math.max(0,R-520),cx,cy,R+40);g.addColorStop(0,"#fff");g.addColorStop(.5,"#fff");g.addColorStop(1,"#000");m.fillStyle=g;m.fillRect(0,0,W,H);
    const fl=Math.sin(Math.PI*clamp(p*1.05));glow(o,cx,cy,mix(160,1700,e),"255,196,120",.85*fl);glow(o,cx,cy,mix(70,760,e),"255,236,180",.95*fl);
    const r=rng(47);for(let i=0;i<160;i++){const a=-Math.PI*(.05+.9*r()),d=R*(.1+.95*r()),u=prog(p,0,1),s=mix(14,40,Math.pow(r(),1.6));const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*1.05-u*mix(40,260,r());const pal=PAL.marigold[Math.floor(r()*3)];petal(o,x,y,s,r()*TAU+p*mix(2,5,r()),Math.max(.2,Math.cos(p*mix(9,18,r())+r()*6.28)),pal[0],pal[1],Math.sin(Math.PI*clamp(u*1.05))*mix(.5,1,r()))}
  }
};
</script></body></html>
