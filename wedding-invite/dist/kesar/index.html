<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wedding invitation">
<style>[hidden]{display:none!important}</style>
<title>Kesariya Invite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* BASE: shared layout for every template. Templates set the colour tokens, the hero and the motion signature.
   Open flow, no boxed cards, one centred column. Tokens a template must define:
   --bg --fg --fg-2 --mute --accent --accent-2 --line --surface --on-accent --display --body --hindi (optional --serif) */
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:0 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
a{color:var(--accent-2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dn{font-family:var(--hindi);color:var(--accent);font-weight:400}

/* side switch: only shown while preview is on, floats at the bottom so it never touches the design */
.preview{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;gap:4px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);background:var(--bg);border:1px solid var(--line);padding:4px 4px 4px 14px;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.22);white-space:nowrap}
.preview a{text-decoration:none;color:var(--fg);padding:6px 12px;border-radius:999px;transition:background .2s}
.preview a[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* opener */
.opener{position:relative;text-align:center;padding-block:64px 24px}
.opener .hindi{font-family:var(--hindi);font-size:24px;line-height:1.4;color:var(--accent);margin:0}
.opener .hindi small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.opener .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);margin:26px auto 40px;max-width:42ch;line-height:1.9}
.names{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,84px);line-height:1.02;letter-spacing:.005em}
.names .n{display:block;margin:0;font:inherit}
.names .amp{display:block;font-family:var(--serif,var(--display));font-style:italic;font-size:.38em;color:var(--accent);margin:22px 0}
.lineage{font-family:var(--body);font-size:14px;line-height:1.7;font-style:normal;font-weight:400;letter-spacing:.01em;color:var(--fg-2);margin:14px auto 0;max-width:42ch}
.opener .date{font-family:var(--display);font-size:24px;line-height:1.3;margin:44px 0 4px}
.opener .place{color:var(--fg-2);margin:0}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:26px;padding:8px 18px;border:1px solid var(--line);border-radius:999px;color:var(--fg-2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.countdown b{font-family:var(--display);font-size:24px;color:var(--accent-2);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:0}
.rule{display:flex;align-items:center;gap:14px;margin:48px auto 0;max-width:220px;color:var(--accent)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.motif{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}

/* sections: open flow, a short rule between them */
.card{position:relative;text-align:center;padding-block:56px 0}
.card::before{content:"";display:block;width:48px;height:1px;background:var(--line);margin:0 auto 40px}
.card.invite{padding-top:20px}
.card.invite::before{display:none}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;margin:0 0 8px;color:var(--accent-2);text-wrap:balance}
.card .lead{color:var(--fg-2);margin:0 auto 32px;max-width:42ch}
.invite-text{font-family:var(--serif,var(--display));font-size:22px;line-height:1.6;max-width:34ch;margin:0 auto}
.signoff{margin-top:40px}
.signoff .warm{margin:0;color:var(--mute);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.signoff .fam{margin:8px 0 0;font-family:var(--serif,var(--display));font-style:italic;font-size:30px;line-height:1.25;color:var(--accent-2);text-wrap:balance}
.signoff .city{margin:10px 0 0;color:var(--fg-2);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:56px}
.fn{display:block}
.fn+.fn::before{content:"";display:block;width:32px;height:1px;background:var(--line);margin:0 auto 40px}
.fn .when{display:flex;justify-content:center;align-items:baseline;gap:12px}
.fn .when .d{font-family:var(--display);font-size:60px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.fn .when .m{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute)}
.fn h3{margin:14px 0 0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;color:var(--fg)}
.fn h3 .dn{display:block;font-size:17px;margin-top:4px}
.fn .headline{margin:12px 0 0;font-family:var(--serif,var(--display));font-style:italic;font-size:22px;line-height:1.35;color:var(--accent-2)}
.fn .evtext{margin:14px auto 0;max-width:44ch;color:var(--fg-2)}
.fn .meta{margin:20px 0 0;color:var(--fg-2)}
.fn .meta b{color:var(--fg);font-weight:600}
.fn .note{margin:12px auto 0;max-width:40ch;color:var(--mute);font-size:14.5px}
.fn .dress{margin:12px 0 0;font-size:14px;color:var(--fg-2)}
.fn .dress b{color:var(--accent-2);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11px;margin-right:8px}
.fn .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:9px 16px;border-radius:999px;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--accent)}
.chip svg{width:15px;height:15px}

.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;text-align:left}
.venue-grid>div{min-width:0}
.venue-grid h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
.venue-grid p{margin:0;color:var(--fg-2);font-size:15px}
.venue-grid p b{color:var(--fg);font-weight:600}

.form{display:flex;flex-direction:column;gap:16px;text-align:left}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--fg-2)}
.field input,.field select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.field input::placeholder{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface);color:var(--fg)}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;padding:15px 20px;cursor:pointer;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn svg{width:18px;height:18px}
.rsvp-foot{font-size:14px;color:var(--fg-2);margin:0;text-align:center}
.rsvp-foot code{font-family:inherit;color:var(--fg);user-select:all;-webkit-user-select:all}
.copy{font:inherit;font-size:13px;color:var(--accent-2);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline}
.msg{margin:0;padding:12px 14px;border-left:2px solid var(--accent);background:var(--surface);color:var(--fg-2);font-size:14px;white-space:pre-wrap;font-family:inherit;border-radius:0 8px 8px 0}

.closing{text-align:center;padding-block:64px 0}
.closing .hindi{font-family:var(--hindi);font-size:20px;color:var(--accent);margin:0}
.closing p{margin:0;color:var(--fg-2)}
.closing .sig{font-family:var(--serif,var(--display));font-style:italic;font-size:24px;color:var(--accent-2);margin-top:14px}

@media (max-width:460px){
  .venue-grid,.row{grid-template-columns:1fr}
  .opener{padding-top:56px}
  .fn .when .d{font-size:52px}
}

/* ---------- motion: one opening sequence, then each section settles in as it scrolls into view ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes reveal{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.opener>.hindi,.opener>.eyebrow,.names .person,.names .amp,.opener>.date,.opener>.place,.opener>.countdown,.opener>.rule{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0s) + var(--t0,.2s))}
.opener>.hindi{--d:0s}
.opener>.eyebrow{--d:.15s}
.names .person:first-child{--d:.4s}
.names .amp{--d:.7s}
.names .person:last-child{--d:.85s}
.opener>.date{--d:1.15s}
.opener>.place{--d:1.25s}
.opener>.countdown{--d:1.4s}
.opener>.rule{--d:1.5s}
@supports (animation-timeline: view()){
  .card,.closing{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
<style>
/* KESARIYA. Layout: a saffron hero under a marigold garland that drops in and sways, names set big in Yatra One and revealed line by line, a scalloped edge, then maroon type on warm ivory. A one-time shower of marigold petals marks the opening. */
:root{
  --bg:#fff4e1; --fg:#3b0d19; --fg-2:#6a3a40; --mute:#98766e;
  --accent:#c24a12; --accent-2:#4a0e1c; --line:rgba(74,14,28,.2);
  --surface:#ffffff; --on-accent:#ffffff;
  --saffron:#f4a636; --saffron-d:#e8891a; --maroon:#4a0e1c;
  --display:"Yatra One","Tiro Devanagari Hindi",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:light;
}
#shower{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.page{max-width:none;padding-inline:0}
.page>:not(.opener):not(.preview){width:100%;max-width:560px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.opener{--t0:.6s;color:var(--maroon);padding:128px max(20px,calc((100% - 520px)/2)) 56px;background:linear-gradient(180deg,var(--saffron),var(--saffron-d))}
.opener::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 50% 0,var(--saffron-d) 11px,transparent 11.5px) 0 0/24px 12px repeat-x}
.toran{position:absolute;top:0;left:0;width:100%;height:96px;transform-origin:50% 0;animation:drop 1.5s cubic-bezier(.3,1.5,.5,1) both,sway 6s ease-in-out 1.5s infinite alternate}
@keyframes drop{from{transform:translateY(-105%)}to{transform:none}}
@keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.opener .hindi,.opener .hindi small,.opener .eyebrow,.opener .lineage,.opener .date,.opener .place,.opener .names .amp{color:var(--maroon)}
.opener .hindi small,.opener .eyebrow,.opener .lineage,.opener .place{opacity:.86}
.opener .countdown{border-color:rgba(74,14,28,.45);color:var(--maroon)}
.opener .countdown b{color:var(--maroon)}
.opener .rule{display:none}
.names{font-size:clamp(46px,13.5vw,88px);line-height:1.05}
.opener .names .n{color:var(--maroon)}
.names .person{animation:none}
.names .n{animation:nameIn 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + var(--t0,.2s))}
.names .lineage{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0s) + var(--t0,.2s) + .35s)}
@keyframes nameIn{from{clip-path:inset(0 0 100% 0);transform:translateY(40%)}to{clip-path:inset(0 0 0 0);transform:none}}

.card.invite{padding-top:80px}
.card h2{color:var(--maroon)}
.fn .when .d{color:var(--accent)}
</style>
</head>
<body>
<canvas id="shower" aria-hidden="true"></canvas>
<main class="page">
  <nav class="preview" id="previewBar" hidden aria-label="Preview">
    <span>Preview as</span>
    <a href="#groom" id="pvGroom">Groom's side</a>
    <a href="#bride" id="pvBride">Bride's side</a>
  </nav>

  <header class="opener">
    <p class="hindi" id="blessing"></p>
    <p class="eyebrow" id="eyebrow"></p>
    <div class="names">
      <div class="person"><h1 class="n" id="nameA"></h1><p class="lineage" id="lineA"></p></div>
      <span class="amp" id="joiner"></span>
      <div class="person"><h2 class="n" id="nameB"></h2><p class="lineage" id="lineB"></p></div>
    </div>
    <p class="date" id="mainDate"></p>
    <p class="place" id="mainPlace"></p>
    <div class="countdown" id="countdown"></div>
    <div class="rule" aria-hidden="true"><span class="motif"></span></div>
  </header>

  <section class="card invite">
    <p class="invite-text" id="inviteText"></p>
    <div class="signoff">
      <p class="warm" id="signWarm"></p>
      <p class="fam" id="signFam"></p>
      <p class="city" id="signCity"></p>
    </div>
  </section>

  <section class="card" id="functions">
    <h2 id="fnTitle"></h2>
    <p class="lead" id="fnLead"></p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="card" id="venue" hidden>
    <h2>Getting there and staying</h2>
    <p class="lead" id="venueLead"></p>
    <div class="venue-grid" id="venueGrid"></div>
  </section>

  <section class="card" id="rsvp" hidden>
    <h2>Will you be there?</h2>
    <p class="lead">Fill this in and send it to us on WhatsApp. It takes a few seconds and helps us plan the food and the rooms.</p>
    <form class="form" id="rsvpForm" novalidate>
      <div class="field"><label for="rName">Your name</label><input id="rName" name="name" autocomplete="name" placeholder="As we know you" required></div>
      <div class="row">
        <div class="field"><label for="rCount">Guests, including you</label>
          <select id="rCount" name="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></div>
        <div class="field"><label for="rCity">Coming from</label><input id="rCity" name="city" placeholder="City"></div>
      </div>
      <div class="field"><span class="flabel">Which functions?</span><div class="checks" id="rFns"></div></div>
      <div class="field"><label for="rNote">Anything we should know?</label><input id="rNote" name="note" placeholder="Food, travel dates, a song for the celebration"></div>
      <pre class="msg" id="rPreview" hidden></pre>
      <button class="btn" type="submit" id="rSend">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.1.6 2.8.5a2.4 2.4 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c0-.2-.2-.2-.5-.3z"/></svg>
        Send RSVP on WhatsApp
      </button>
      <p class="rsvp-foot">If WhatsApp doesn't open, message <code id="rPhone"></code> <button type="button" class="copy" id="copyPhone">copy number</button></p>
    </form>
  </section>

  <footer class="closing">
    <p class="hindi" id="closingHindi"></p>
    <p id="closingLine"></p>
    <p class="sig" id="closingSig"></p>
  </footer>
</main>

<script>
/* =====================================================================
   CONFIG: every template reads this. Edit this file only.
   Dates are YYYY-MM-DD, times are 24h "HH:MM".
   `side` picks whose copy of the invitation this is: "groom" or "bride".
   The host side lists its own name, lineage and family first. In the URL,
   #groom or #bride overrides it. Set preview:false before sending: it hides the side switch.
   In event text, {host} and {other} become the first names, host side first.
   ===================================================================== */
const CONFIG = {
  preview: true,
  side: "groom",
  blessing: "॥ श्री गणेशाय नमः ॥",
  blessingEn: "Shri Ganeshaya Namah",
  intro: "With the blessings of the Almighty and our beloved elders,<br>We cordially invite you to celebrate the auspicious wedding ceremony of",
  joiner: "with",
  groom: {
    name: "Neelesh Kumar",
    lineage: ["Grandson of Late Shri Kisan Lal", "Son of Shri Vijay Kumar & Smt. Archana Devi"],
    family: "Kumar Family",
    whatsapp: ""            // country code + number, digits only, e.g. "919876543210". Empty hides the RSVP card.
  },
  bride: {
    name: "Pragyaniti",
    lineage: ["Granddaughter of Late Shri Budh Lal", "Daughter of Shri Anil Kumar & Smt. Pushpa"],
    family: "Pushpa Family",
    whatsapp: ""
  },
  city: "Prayagraj",
  inviteText: "As they embark on a beautiful journey of togetherness.<br>Your gracious presence and blessings will make this occasion truly special.",
  signoff: "With warm regards,",
  functionsTitle: "The celebration",
  functions: [
    {
      side: "both",
      name: "Wedding & Baraat Welcome",
      date: "2026-12-11", time: "21:00", timeText: "9:00 PM onwards",
      venue: "", address: "",     // add the venue and address when confirmed; add map:"https://maps.google.com/?q=..." for a Maps button
      headline: "The day we've all been waiting for!",
      body: "With immense joy, we invite you to celebrate the wedding of {host} & {other}. Join us to welcome the Baraat and bless the couple as they begin their beautiful journey together.",
      note: "Your presence and blessings will make this occasion unforgettable."
    }
  ],
  travel: [],                    // optional cards: [{ h:"Nearest airport", p:"<b>...</b> ..." }]. Empty hides the section.
  venueLead: "",
  closingHindi: "॥ श्री गणेशाय नमः ॥",
  closingLine: "",
  closingSig: ""
};

</script>
<script>
/* Procedural ornament and motion helpers. Nothing here is an image.
   ORN.mandalaSVG(size)        a line-art gold mandala whose strokes can draw themselves (class .emblem)
   ORN.archPath(w, h, cusps)   SVG path of a cusped (Mughal) arch
   ORN.toran(canvas, opts)     marigold garland strings across the top of a canvas
   ORN.sparks(canvas, opts)    embers rising slowly, like sparks off a diya
   ORN.petals(canvas, opts)    drifting or showering petals                                           */
const ORN = (() => {
  const TAU = Math.PI * 2;
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const R = (a, b) => a + Math.random() * (b - a);

  function ringPath(r0, L, w, n, off = 0) {
    let d = "";
    for (let i = 0; i < n; i++) {
      const a = off + i * TAU / n, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
      const P = (x, y) => `${(50 + ux * (r0 + y) + vx * x).toFixed(2)},${(50 + uy * (r0 + y) + vy * x).toFixed(2)}`;
      d += `M${P(0, 0)}C${P(w, L * .35)} ${P(w, L * .75)} ${P(0, L)}C${P(-w, L * .75)} ${P(-w, L * .35)} ${P(0, 0)}`;
    }
    return d;
  }
  function mandalaSVG(size = 92) {
    const p = (d, i) => `<path d="${d}" pathLength="1" style="--i:${i}"/>`;
    const c = (r, i) => `<circle cx="50" cy="50" r="${r}" pathLength="1" style="--i:${i}"/>`;
    return `<svg class="emblem" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">${c(48.5, 0)}${c(45.5, 0)}${p(ringPath(31, 14, 5.2, 16), 1)}${p(ringPath(15, 16, 5, 16, Math.PI / 16), 2)}${p(ringPath(6, 12, 3.6, 8), 3)}${c(3, 4)}</svg>`;
  }

  function archPath(w, h, cusps = 7) {
    const r = w / 2, cx = w / 2, bulge = r * 0.2, cy = r + bulge + 2;
    let d = `M0 ${h} L0 ${cy.toFixed(1)} `;
    for (let i = 0; i < cusps; i++) {
      const a0 = Math.PI + Math.PI * i / cusps, a1 = Math.PI + Math.PI * (i + 1) / cusps, am = (a0 + a1) / 2;
      const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
      const mx = cx + Math.cos(am) * (r + bulge), my = cy + Math.sin(am) * (r + bulge);
      d += `Q${mx.toFixed(1)} ${my.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)} `;
    }
    return d + `L${w} ${h} Z`;
  }

  function marigold(ctx, x, y, r, a, b) {
    const g = ctx.createRadialGradient(x - r * .2, y - r * .2, r * .1, x, y, r); g.addColorStop(0, b); g.addColorStop(1, a);
    ctx.fillStyle = g; ctx.beginPath(); const k = 14;
    for (let i = 0; i <= k * 4; i++) { const t = i / (k * 4) * TAU, rr = r * (0.82 + 0.18 * Math.abs(Math.sin(t * k / 2))); ctx.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(120,50,0,.32)"; ctx.beginPath();
    for (let i = 0; i <= k * 4; i++) { const t = i / (k * 4) * TAU, rr = r * .5 * (0.8 + 0.2 * Math.abs(Math.sin(t * k / 2 + 1))); ctx.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
    ctx.closePath(); ctx.fill();
  }
  function leaf(ctx, x, y, ang, len, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * .28, len * .45, 0, len); ctx.quadraticCurveTo(-len * .28, len * .45, 0, 0); ctx.fill(); ctx.restore();
  }
  function toran(c, o = {}) {
    const ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2), W = c.clientWidth, H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const orange = o.orange || "#e5781c", yellow = o.yellow || "#f6b63a", green = o.green || "#3f7a3a", dark = o.greenDark || "#2c5a2a";
    const fr = Math.max(7, Math.min(11, W / 48)), n = Math.max(2, Math.round(W / (fr * 9.5))), seg = W / n, sag = Math.min(56, seg * .4);
    ctx.strokeStyle = "rgba(60,30,0,.5)"; ctx.lineWidth = 1.2;
    for (let s = 0; s < n; s++) { const x0 = s * seg, x1 = x0 + seg; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.quadraticCurveTo((x0 + x1) / 2, sag * 2, x1, 0); ctx.stroke(); }
    for (let s = 0; s < n; s++) {
      const x0 = s * seg, x1 = x0 + seg, cnt = Math.round(seg / (fr * 1.5));
      for (let i = 0; i <= cnt; i++) {
        const t = i / cnt, x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * (x0 + x1) / 2 + t * t * x1, y = 2 * (1 - t) * t * sag * 2 + fr * .2, k = i + s;
        if (k % 3 === 2) { leaf(ctx, x, y - fr * .3, Math.PI * .9, fr * 2, k % 2 ? green : dark); leaf(ctx, x, y - fr * .3, Math.PI * 1.1, fr * 2, green); }
        marigold(ctx, x, y, fr * (k % 2 ? .95 : 1.05), orange, yellow);
      }
    }
  }

  /* Embers: slow, sparse, gold. Pauses itself when reduced motion is asked for. */
  function sparks(canvas, o = {}) {
    if (reduced()) { canvas.remove(); return; }
    const ctx = canvas.getContext("2d"), col = o.color || "217,181,99"; let W, H, dpr, ps = [];
    const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); addEventListener("resize", size);
    for (let i = 0; i < (o.count || 30); i++) ps.push({ x: R(0, innerWidth), y: R(0, innerHeight), r: R(.6, 1.9), vy: R(.12, .45), sw: R(.4, 1.2), ph: R(0, TAU), tw: R(.6, 1.6) });
    (function tick(now) {
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.y -= p.vy; p.x += Math.sin(now / 1400 * p.sw + p.ph) * .25;
        if (p.y < -10) { p.y = H + 10; p.x = R(0, W); }
        const fade = Math.min(1, p.y / (H * .25)), a = (.2 + .5 * (.5 + .5 * Math.sin(now / 1000 * p.tw + p.ph))) * Math.max(0, fade);
        ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${col},.8)`; ctx.fillStyle = `rgba(${col},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      }
      requestAnimationFrame(tick);
    })(performance.now());
  }

  /* Petals. loop:true drifts forever; loop:false is a single shower that removes its canvas when done. */
  function petals(canvas, o = {}) {
    if (reduced()) { canvas.remove(); return; }
    const ctx = canvas.getContext("2d"); let W, H, dpr;
    const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); addEventListener("resize", size);
    const mk = t0 => ({ x: R(0, innerWidth), y: o.loop ? R(-innerHeight, innerHeight) : -20, r: R(...o.size), vy: R(...o.speed), sw: R(.5, 1.6), ph: R(0, TAU), rot: R(0, TAU), vr: R(-.03, .03), fl: R(0, TAU), vf: R(.02, .06), c: o.colors[Math.floor(Math.random() * o.colors.length)], al: R(.55, .95), t0 });
    const ps = Array.from({ length: o.count }, () => mk(o.loop ? 0 : R(0, o.spread || 3000)));
    const start = performance.now();
    (function tick(now) {
      const el = now - start; ctx.clearRect(0, 0, W, H); let alive = 0;
      for (const p of ps) {
        if (p.dead) continue; alive++; if (el < p.t0) continue;
        p.y += p.vy; p.x += Math.sin(el / 900 * p.sw + p.ph) * .6; p.rot += p.vr; p.fl += p.vf;
        if (p.y > H + 20) { if (o.loop) { p.y = -20; p.x = R(0, W); } else { p.dead = true; continue; } }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.max(.25, Math.abs(Math.cos(p.fl))), 1);
        ctx.globalAlpha = p.al; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.r * .62, p.r, 0, 0, TAU); ctx.fill(); ctx.restore();
      }
      if (alive) requestAnimationFrame(tick); else canvas.remove();
    })(start);
  }

  return { mandalaSVG, archPath, toran, sparks, petals };
})();

</script>
<script>
/* Shared renderer. Reads CONFIG, fills the markup, wires RSVP. Every template uses this unchanged. */
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const first = s => String(s).trim().split(/\s+/)[0];
  const parse = (d, t="00:00") => new Date(`${d}T${t}:00`);
  const fmtTime = t => { const [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; const hh = h%12||12; return m ? `${hh}:${String(m).padStart(2,"0")} ${ap}` : `${hh} ${ap}`; };
  const longDate = d => { const x = parse(d); return `${DAYS[x.getDay()]}, ${x.getDate()} ${MONTHS_LONG[x.getMonth()]} ${x.getFullYear()}`; };
  const stampD = d => { const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`; };
  /* Calendar span. With no end time the event is saved as 3 hours; the guest can adjust it. */
  const span = f => { const s = parse(f.date, f.time); let e = f.end ? parse(f.date, f.end) : new Date(s.getTime() + 3*36e5); if (e <= s) e = new Date(e.getTime() + 864e5); return [s, e]; };
  const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const cal = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const sideFromHash = () => { const h = location.hash.replace("#",""); return h === "bride" || h === "groom" ? h : null; };
  const setText = (id, txt) => { const el = $(id); el.textContent = txt || ""; el.hidden = !txt; };

  /* One size for both names, shrunk until the longer one fits its column. */
  function fitNames(){
    const ns = [...document.querySelectorAll(".names .n")];
    ns.forEach(n => { n.style.whiteSpace = "nowrap"; n.style.fontSize = ""; });
    const size = Math.max(26, Math.min(...ns.map(n => { const fs = parseFloat(getComputedStyle(n).fontSize), cw = n.clientWidth, sw = n.scrollWidth; return sw > cw && cw > 0 ? fs * cw / sw * .97 : fs; })));
    ns.forEach(n => n.style.fontSize = size + "px");
  }

  function render(){
    const side = sideFromHash() || CONFIG.side || "groom";
    const host = CONFIG[side], other = CONFIG[side === "groom" ? "bride" : "groom"];
    const fill = s => String(s||"").replace(/\{host\}/g, first(host.name)).replace(/\{other\}/g, first(other.name));
    const fns = CONFIG.functions.filter(f => f.side === "both" || f.side === side);
    const main = fns.find(f => /phera|wedding|shaadi|vivah|nikah/i.test(f.name)) || fns[fns.length-1];
    const f0 = fns[0], fN = fns[fns.length-1];
    document.documentElement.dataset.side = side;
    document.title = `${first(host.name)} & ${first(other.name)} · Wedding invitation`;

    $("previewBar").hidden = !CONFIG.preview;
    $("pvGroom").setAttribute("aria-current", side === "groom" ? "page" : "false");
    $("pvBride").setAttribute("aria-current", side === "bride" ? "page" : "false");

    $("blessing").innerHTML = esc(CONFIG.blessing) + (CONFIG.blessingEn ? `<small>${esc(CONFIG.blessingEn)}</small>` : "");
    $("eyebrow").innerHTML = CONFIG.intro;
    $("nameA").textContent = host.name; $("nameB").textContent = other.name;
    $("joiner").textContent = CONFIG.joiner || "and";
    $("lineA").innerHTML = (host.lineage||[]).map(esc).join("<br>");
    $("lineB").innerHTML = (other.lineage||[]).map(esc).join("<br>");
    $("mainDate").textContent = longDate(main.date);
    $("mainPlace").textContent = [main.venue, CONFIG.city].filter(Boolean).join(", ");

    $("inviteText").innerHTML = CONFIG.inviteText;
    setText("signWarm", CONFIG.signoff);
    setText("signFam", `${host.family} & ${other.family}`);
    setText("signCity", CONFIG.city);

    $("fnTitle").textContent = CONFIG.functionsTitle || "The functions";
    $("fnLead").textContent = fns.length === 1
      ? "Save it to your calendar so the evening isn't missed."
      : `${f0.date === fN.date ? "One day" : `${parse(f0.date).getDate()} to ${parse(fN.date).getDate()} ${MONTHS_LONG[parse(fN.date).getMonth()]}`}, ${fns.length} functions. Tap one to open the venue in Maps or add it to your calendar.`;

    const days = Math.ceil((parse(main.date, main.time) - Date.now())/864e5);
    $("countdown").innerHTML = days > 1 ? `<b>${days}</b><span>days to go</span>` : days === 1 ? `<b>1</b><span>day to go</span>` : days === 0 ? `<b>Today</b>` : `<b>Married</b><span>${Math.abs(days)} days ago</span>`;

    const gcal = f => { const [s, e] = span(f); const place = [f.venue, f.address, CONFIG.city].filter(Boolean).join(", ");
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`${f.name}: ${host.name} & ${other.name}`)}&dates=${stampD(s)}/${stampD(e)}&location=${encodeURIComponent(place)}&details=${encodeURIComponent(fill(f.body || f.note))}`; };
    $("timeline").innerHTML = fns.map(f => { const d = parse(f.date);
      const time = f.timeText || (fmtTime(f.time) + (f.end ? ` to ${fmtTime(f.end)}` : ""));
      const place = [f.venue, f.address].filter(Boolean).join(", ") || CONFIG.city;
      return `<li class="fn">
      <div class="when"><div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()]}</div></div>
      <div class="what">
        <h3>${esc(f.name)}${f.hindi ? `<span class="dn" lang="hi">${esc(f.hindi)}</span>` : ""}</h3>
        ${f.headline ? `<p class="headline">${esc(fill(f.headline))}</p>` : ""}
        ${f.body ? `<p class="evtext">${esc(fill(f.body))}</p>` : ""}
        <p class="meta"><b>${esc(time)}</b> · ${esc(place)}</p>
        ${f.note ? `<p class="note">${esc(fill(f.note))}</p>` : ""}
        ${f.dress ? `<p class="dress"><b>Wear</b>${esc(f.dress)}</p>` : ""}
        <div class="acts">
          ${f.map ? `<a class="chip" href="${esc(f.map)}" target="_blank" rel="noopener">${pin}Open in Maps</a>` : ""}
          <a class="chip" href="${gcal(f)}" target="_blank" rel="noopener">${cal}Add to calendar</a>
        </div>
      </div></li>`; }).join("");

    const travel = CONFIG.travel || [];
    $("venue").hidden = !travel.length;
    $("venueLead").textContent = CONFIG.venueLead || "";
    $("venueGrid").innerHTML = travel.map(t => `<div><h4>${esc(t.h)}</h4><p>${t.p}</p></div>`).join("");

    $("rsvp").hidden = !host.whatsapp;
    $("rPhone").textContent = host.whatsapp ? "+" + host.whatsapp : "";
    const keep = new Set([...document.querySelectorAll('#rFns input:checked')].map(i => i.value));
    const fresh = !$("rFns").children.length;
    $("rFns").innerHTML = fns.map((f,i) => `<label><input type="checkbox" name="fn" value="${esc(f.name)}" id="fn${i}" ${fresh || keep.has(f.name) ? "checked" : ""}>${esc(f.name)}</label>`).join("");

    setText("closingHindi", CONFIG.closingHindi); setText("closingLine", CONFIG.closingLine); setText("closingSig", CONFIG.closingSig);
    render.current = { side, host, other, fns };
    fitNames();
  }

  const form = $("rsvpForm");
  const buildMsg = () => {
    const { host, other } = render.current; const fd = new FormData(form); const fns = fd.getAll("fn");
    return [
      `RSVP for ${host.name} & ${other.name}'s wedding`,
      `Name: ${fd.get("name")||""}`,
      `Guests: ${fd.get("count")}`,
      fd.get("city") ? `Coming from: ${fd.get("city")}` : null,
      `Attending: ${fns.length ? fns.join(", ") : "Sadly can't make it"}`,
      fd.get("note") ? `Note: ${fd.get("note")}` : null
    ].filter(Boolean).join("\n");
  };
  form.addEventListener("input", () => { const p = $("rPreview"); p.hidden = !$("rName").value.trim(); p.textContent = buildMsg(); });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!$("rName").value.trim()) { $("rName").focus(); $("rName").placeholder = "We need your name first"; return; }
    const url = `https://wa.me/${render.current.host.whatsapp}?text=${encodeURIComponent(buildMsg())}`;
    const w = window.open(url, "_blank", "noopener"); if (!w) location.href = url;
  });
  $("copyPhone").addEventListener("click", async () => {
    const b = $("copyPhone"); const txt = "+" + render.current.host.whatsapp;
    try { await navigator.clipboard.writeText(txt); b.textContent = "copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("rPhone")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected, press copy"; }
    setTimeout(() => b.textContent = "copy number", 1800);
  });

  render();
  addEventListener("hashchange", render);
  addEventListener("resize", fitNames);
  if (document.fonts) document.fonts.ready.then(fitNames);
})();

</script>
<script>
(() => {
  const opener = document.querySelector(".opener");
  const toran = document.createElement("canvas"); toran.className = "toran"; toran.setAttribute("aria-hidden", "true"); opener.prepend(toran);
  const draw = () => ORN.toran(toran);
  draw(); addEventListener("resize", draw);
  ORN.petals(document.getElementById("shower"), { count: 46, colors: ["#f59a1b", "#f7b733", "#e5701a", "#fbd160"], size: [4, 8], speed: [1.2, 2.6], loop: false, spread: 3600 });
})();
</script>
