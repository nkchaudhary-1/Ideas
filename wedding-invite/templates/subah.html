<title>Gulabi Subah Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Karla:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* GULABI SUBAH. Layout: a Jaipur morning. Block-printed rose paper, the names inside an emerald cusped arch with a gold mandala, paisley corners, gold-ruled sections. */
:root{
  --paper:#fbf3ee; --paper-2:#f6e6dd; --paper-3:#ead2c6;
  --ink:#2a1a1e; --ink-2:#5c4a50; --mute:#9a858b;
  --gulabi:#c3456b; --gulabi-2:#9a2d52;
  --mor:#174e43; --mor-2:#1f5f52; --mor-3:#0f3a32;
  --gold:#c9a24c; --gold-2:#e9cf84; --gold-line:rgba(201,162,76,.55);
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper-2);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--boota);background-size:112px 112px}
.page{position:relative;z-index:1;overflow:hidden;max-width:600px;margin:22px auto 44px;background:var(--paper);border:1px solid var(--gold);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--gold-line),0 24px 50px rgba(90,40,50,.18);padding-block:0 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
@media (min-width:640px){.page{padding-inline:36px}}
.corner{position:absolute;width:64px;height:86px;z-index:2;pointer-events:none}
.corner.tl{top:7px;left:7px}.corner.tr{top:7px;right:7px;transform:scaleX(-1)}.corner.bl{bottom:7px;left:7px;transform:scaleY(-1)}.corner.br{bottom:7px;right:7px;transform:scale(-1)}
.corner svg{width:100%;height:100%}
a{color:var(--gulabi-2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mor);outline-offset:3px}
.dn{font-family:var(--hindi);color:var(--gulabi);font-weight:400}

.preview{align-self:center;display:inline-flex;gap:4px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--gold-line);padding:3px 4px 3px 12px;border-radius:999px;background:var(--paper);margin:16px 0 10px;position:relative;z-index:3}
.preview a{text-decoration:none;color:var(--ink);padding:4px 10px;border-radius:999px}
.preview a[aria-current="page"]{background:var(--mor);color:#fff;font-weight:600}

/* the arch: an SVG behind the opener, sized by script */
.opener{position:relative;text-align:center;padding:clamp(80px,26vw,150px) 18px 34px;color:var(--paper);margin-top:16px}
.arch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mandala{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,105%);aspect-ratio:1;max-width:none;pointer-events:none;opacity:.5}
.opener>*{position:relative}
.opener .mandala,.opener .arch{position:absolute}
.opener .hindi{font-family:var(--hindi);font-size:20px;color:var(--gold-2);margin:0 0 12px;letter-spacing:.04em}
.opener .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-2);margin:0 auto 22px;max-width:44ch;line-height:1.7;opacity:.9}
.names{font-family:var(--display);font-weight:400;font-size:clamp(42px,11.5vw,72px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance;color:var(--paper)}
.names .n{display:block;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.names .amp{display:block;font-family:var(--serif);font-style:italic;font-size:.42em;color:var(--gold-2);margin:6px 0}
.opener .date{font-family:var(--serif);font-size:23px;margin:22px 0 2px;font-weight:500;font-style:italic;color:var(--paper)}
.opener .place{color:var(--paper-2);margin:0;font-size:15px}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:18px;padding:8px 16px;border:1px solid var(--gold);border-radius:999px;color:var(--paper-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.countdown b{font-family:var(--display);font-size:24px;color:var(--gold-2);font-variant-numeric:tabular-nums;letter-spacing:0}
.rule{display:none}

.card{padding-block:28px 10px;position:relative}
.card+.card::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card+.card::after{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%) rotate(45deg);width:7px;height:7px;background:var(--gulabi)}
.card.invite{padding-top:30px}
.card h2{font-family:var(--display);font-weight:400;font-size:27px;margin:0 0 4px;letter-spacing:.01em;color:var(--mor);text-wrap:balance;text-align:center}
.card .lead{color:var(--ink-2);margin:0 auto 20px;max-width:46ch;text-align:center}
.invite-text{font-family:var(--serif);font-size:22px;max-width:40ch;margin:0 auto;text-align:center;line-height:1.45}
.invite-text em{font-style:italic;color:var(--gulabi-2)}

.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--gold);display:flex;flex-direction:column;gap:22px}
.fn{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.fn::before{content:"";position:absolute;left:-25px;top:9px;width:9px;height:9px;transform:rotate(45deg);background:var(--paper);border:1px solid var(--gulabi);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 9px var(--gulabi)}
.fn .what{min-width:0;grid-column:1/-1}
.fn .when{display:flex;align-items:baseline;gap:6px;font-family:var(--display);color:var(--gulabi-2)}
.fn .when .d{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.fn .when .m{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--body);color:var(--mute)}
.fn h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--mor-3)}
.fn h3 .dn{font-size:17px;margin-left:8px}
.fn .meta{margin:3px 0 0;color:var(--ink-2);font-size:15px}
.fn .meta b{color:var(--ink);font-weight:600}
.fn .note{margin:6px 0 0;color:var(--ink-2);font-size:14px;font-style:italic;font-family:var(--serif);font-size:16px}
.fn .dress{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.fn .dress b{color:var(--mor);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:6px}
.fn .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--mor);text-decoration:none;border:1px solid var(--gold-line);padding:5px 11px;border-radius:999px;background:#fff}
.chip:hover{border-color:var(--mor)}
.chip svg{width:14px;height:14px}

.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.venue-grid>div{min-width:0}
.venue-grid h4{margin:0 0 3px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mor);font-weight:600}
.venue-grid p{margin:0;color:var(--ink-2);font-size:15px}
.venue-grid p b{color:var(--ink);font-weight:600}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--ink-2)}
.field input,.field select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--paper-3);border-radius:4px;padding:11px 12px;width:100%}
.field input::placeholder{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:7px 12px;border:1px solid var(--paper-3);border-radius:999px;cursor:pointer;background:#fff}
.checks input{accent-color:var(--mor);margin:0}
.checks label:has(input:checked){border-color:var(--mor);color:var(--mor)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;color:#fff;background:var(--mor);border:1px solid var(--gold);border-radius:4px;padding:14px 18px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--mor),inset 0 0 0 3px var(--gold-line)}
.btn:hover{background:var(--mor-2)}
.btn svg{width:18px;height:18px}
.rsvp-foot{font-size:14px;color:var(--ink-2);margin:0}
.rsvp-foot code{font-family:inherit;color:var(--ink);user-select:all;-webkit-user-select:all}
.copy{font:inherit;font-size:13px;color:var(--gulabi-2);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline}
.msg{margin:0;padding:12px 14px;border-left:2px solid var(--gulabi);background:var(--paper-2);color:var(--ink-2);font-size:14px;white-space:pre-wrap;font-family:inherit}

.closing{text-align:center;padding-block:34px 8px;position:relative;margin-top:20px}
.closing::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.closing .hindi{font-family:var(--hindi);font-size:19px;color:var(--gulabi);margin:0 0 6px}
.closing p{margin:0;color:var(--ink-2)}
.closing .sig{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--mor-3);margin-top:14px}

/* lineage, sign-off and event copy */
.names .n{margin:0;font:inherit}
.names .person{display:block}
.names .amp{margin:14px 0}
.lineage{font-family:var(--body);font-size:13.5px;line-height:1.55;font-weight:400;font-style:normal;letter-spacing:.01em;color:var(--paper-2);margin:10px auto 0;max-width:44ch;text-shadow:none}
.opener .hindi small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper-2);margin-top:6px}
.signoff{margin-top:22px;text-align:center;border-top:1px solid var(--gold-line);padding-top:16px}
.signoff .warm{margin:0;color:var(--ink-2);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.signoff .fam{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:26px;text-wrap:balance;line-height:1.2;color:var(--gulabi-2)}
.signoff .city{margin:6px 0 0;color:var(--mor);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.fn .headline{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:21px;color:var(--gulabi-2);line-height:1.3}
.fn .evtext{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:52ch}

@media (max-width:460px){
  .venue-grid,.row{grid-template-columns:1fr}
  .page{margin:12px auto 32px}
  .opener{padding-inline:12px;padding-bottom:28px}
  .corner{width:50px;height:66px}
}
</style>
<!--DECOR-->
<div class="bg" aria-hidden="true"></div>
<!--SCRIPT-->
<script>
(() => {
  const page = document.querySelector(".page"), opener = document.querySelector(".opener");
  document.documentElement.style.setProperty("--boota", `url(${ORN.blockPrint({ petal:"rgba(195,69,107,.26)", center:"rgba(201,162,76,.75)", leaf:"rgba(23,78,67,.34)", dot:"rgba(195,69,107,.45)" }, 112)})`);
  for (const c of ["tl","tr","bl","br"]) { const d = document.createElement("div"); d.className = "corner " + c; d.innerHTML = ORN.paisleySVG("#c9a24c"); d.setAttribute("aria-hidden","true"); page.appendChild(d); }
  const arch = document.createElementNS("http://www.w3.org/2000/svg","svg"); arch.setAttribute("class","arch"); arch.setAttribute("aria-hidden","true");
  arch.setAttribute("preserveAspectRatio","none"); opener.insertBefore(arch, opener.firstChild);
  const m = document.createElement("canvas"); m.className = "mandala"; m.setAttribute("aria-hidden","true"); arch.insertAdjacentElement("afterend", m);
  const draw = () => {
    const w = opener.clientWidth, h = opener.clientHeight; arch.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const d = ORN.archPath(w, h, 7);
    const inset = 9; const d2 = ORN.archPath(w - inset * 2, h - inset, 7);
    arch.innerHTML = `<path d="${d}" fill="#174e43"/><path d="${d}" fill="none" stroke="#c9a24c" stroke-width="2"/>` +
      `<path d="${d2}" fill="none" stroke="#e9cf84" stroke-width="1" stroke-dasharray="2 4" transform="translate(${inset} ${inset})"/>`;
    const dpr = Math.min(devicePixelRatio || 1, 2); const s = m.clientWidth; m.width = s * dpr; m.height = s * dpr;
    const ctx = m.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,s,s);
    ORN.mandala(ctx, s/2, s/2, s*.48, "#e9cf84", { n: 16, lineWidth: 1 });
  };
  draw(); addEventListener("resize", draw); addEventListener("hashchange", () => setTimeout(draw)); if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
