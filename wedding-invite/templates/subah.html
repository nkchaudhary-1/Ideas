<title>Gulabi Subah Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* GULABI SUBAH. Layout: a blush morning. The names sit inside one emerald cusped arch that rises, then outlines itself in gold. Everything else is quiet type on plain paper, with a few rose petals drifting by. */
:root{
  --bg:#fbf3ef; --wash:#f6e2db; --fg:#2b1a20; --fg-2:#5d4a52; --mute:#8f7a82;
  --accent:#b3365f; --accent-2:#16483e; --line:rgba(185,143,58,.38);
  --surface:#ffffff; --on-accent:#ffffff;
  --emerald:#16483e; --gold:#c9a24c; --gold-2:#ebd38a; --paper:#fbf3ef;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:light;
}
body{background-image:linear-gradient(180deg,var(--wash),transparent 620px);background-repeat:no-repeat}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fn .headline{color:var(--accent)}
.card h2{color:var(--emerald)}
.signoff .fam{color:var(--accent)}
.countdown b{color:var(--accent)}

.opener{--t0:.9s;margin-top:22px;padding:clamp(96px,27vw,150px) clamp(16px,6vw,36px) 44px;color:#f8efe7}
.opener>*:not(.arch){position:relative;z-index:1}
.arch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;animation:archUp 1.5s cubic-bezier(.65,0,.25,1) .1s both}
.arch .fill{fill:var(--emerald)}
.arch .edge{fill:none;stroke:var(--gold);stroke-width:1.5}
.arch .inner{fill:none;stroke:var(--gold-2);stroke-width:1;opacity:.75;animation:draw 3s cubic-bezier(.45,0,.2,1) 1.1s both}
@keyframes archUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.opener .hindi{color:var(--gold-2)}
.opener .hindi small{color:rgba(248,239,231,.72)}
.opener .eyebrow{color:rgba(248,239,231,.8)}
.opener .names .n{color:#fdf6ef}
.opener .names .amp{color:var(--gold-2)}
.opener .lineage{color:rgba(248,239,231,.82)}
.opener .date{color:#fdf6ef}
.opener .place{color:rgba(248,239,231,.8)}
.opener .countdown{color:rgba(248,239,231,.85);border-color:rgba(235,211,138,.5)}
.opener .countdown b{color:var(--gold-2)}
.opener .rule{display:none}
.card.invite{padding-top:56px}
</style>
<!--DECOR-->
<canvas id="petals" aria-hidden="true"></canvas>
<!--SCRIPT-->
<script>
(() => {
  const opener = document.querySelector(".opener"), NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "arch"); svg.setAttribute("aria-hidden", "true"); svg.setAttribute("preserveAspectRatio", "none");
  const mk = (cls, extra = {}) => { const p = document.createElementNS(NS, "path"); p.setAttribute("class", cls); for (const k in extra) p.setAttribute(k, extra[k]); svg.appendChild(p); return p; };
  const fill = mk("fill"), edge = mk("edge"), inner = mk("inner", { pathLength: "1" });
  opener.prepend(svg);
  const fit = () => {
    const w = opener.clientWidth, h = opener.clientHeight, i = 10; if (!w || !h) return;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const d = ORN.archPath(w, h, 7); fill.setAttribute("d", d); edge.setAttribute("d", d);
    inner.setAttribute("d", ORN.archPath(w - i * 2, h - i, 7)); inner.setAttribute("transform", `translate(${i} ${i})`);
  };
  fit(); new ResizeObserver(fit).observe(opener);
  ORN.petals(document.getElementById("petals"), { count: 11, colors: ["#e9a3b7", "#f2bccb", "#d98aa2"], size: [5, 9], speed: [.25, .6], loop: true });
})();
</script>
