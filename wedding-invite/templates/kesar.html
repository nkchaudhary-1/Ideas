<title>Kesar Wedding Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* KESAR. Layout: a poster. Full-bleed vermilion opener with the names set huge, a running marquee strip, then ink-ruled sections on cool off-white. Committed single look. */
:root{
  --chalk:#f4f3ee; --chalk-2:#e9e7df;
  --ink:#171311; --ink-2:#4a433f; --mute:#8a827c;
  --kesar:#e3461c; --kesar-2:#c73913; --haldi:#f3c13a;
  --display:"Syne","Arial Black","Helvetica Neue",sans-serif;
  --body:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
a{color:var(--kesar-2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dn{font-family:var(--hindi);font-weight:400}

.preview{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));z-index:3;display:inline-flex;gap:2px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);border:2px solid var(--ink);background:var(--ink);padding:0}
.preview span{padding:0 10px}
.preview a{text-decoration:none;color:var(--chalk);padding:6px 10px;font-weight:600}
.preview a[aria-current="page"]{background:var(--haldi);color:var(--ink)}

/* the vermilion band runs edge to edge behind the opener */
.band{position:absolute;left:0;right:0;top:0;height:620px;background:var(--kesar);z-index:0}
.opener{position:relative;z-index:1;color:var(--chalk);padding-block:64px 36px;text-align:left}
.opener .hindi{font-family:var(--hindi);font-size:20px;margin:0 0 20px;color:var(--chalk)}
.opener .eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 28px;max-width:40ch;line-height:1.6;font-weight:500}
.names{font-family:var(--display);font-weight:800;font-size:clamp(44px,13.5vw,128px);line-height:.86;margin:0 0 0 -.04em;text-transform:uppercase;letter-spacing:-.03em;text-wrap:balance}
.names .n{display:block;white-space:nowrap}
.names .amp{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.3em;text-transform:uppercase;margin:16px 0 14px .3em;color:var(--haldi)}
.opener .date{font-family:var(--display);font-weight:700;font-size:22px;margin:30px 0 4px;letter-spacing:-.01em}
.opener .place{margin:0;font-size:15px;opacity:.9}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:22px;padding:8px 12px;border:2px solid var(--chalk);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.countdown b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:0}
.rule{display:none}

/* marquee strip */
.strip{position:absolute;left:0;right:0;z-index:1;background:var(--ink);color:var(--chalk);overflow:hidden;white-space:nowrap;padding-block:10px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.strip .track{display:inline-block;animation:run 36s linear infinite}
.strip .dn{color:var(--haldi);letter-spacing:0;text-transform:none;font-size:15px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.strip .track{animation:none}}

.card{padding-block:34px 10px;border-top:3px solid var(--ink)}
.card.invite{border-top:0;padding-top:30px}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0 0 6px;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.card .lead{color:var(--ink-2);margin:0 0 22px;max-width:52ch}
.invite-text{font-size:19px;max-width:40ch;margin:0;line-height:1.5;font-weight:500}
.invite-text em{font-style:normal;color:var(--kesar-2);font-family:var(--display);font-weight:700}
.families{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.families>div{min-width:0;border-top:1px solid var(--ink);padding-top:10px}
.families small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kesar-2);margin-bottom:4px;font-weight:600}
.families span{font-size:15px;color:var(--ink-2)}
.families .dn{font-size:14px;color:var(--ink)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fn{display:grid;grid-template-columns:88px 1fr;gap:0 18px;padding-block:20px;border-top:1px solid var(--ink)}
.fn:first-child{border-top:0;padding-top:0}
.fn .what{min-width:0}
.fn .when{font-family:var(--display);line-height:1}
.fn .when .d{font-size:56px;font-weight:800;letter-spacing:-.04em;color:var(--kesar);font-variant-numeric:tabular-nums}
.fn .when .m{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:700;margin-top:4px}
.fn h3{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.fn h3 .dn{font-size:17px;margin-left:8px;color:var(--kesar-2)}
.fn .meta{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.fn .meta b{color:var(--ink);font-weight:600}
.fn .note{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.fn .dress{font-size:14px;color:var(--ink-2);margin:8px 0 0}
.fn .dress b{display:inline-block;color:var(--ink);background:var(--haldi);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:1px 6px;margin-right:8px}
.fn .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:5px 10px}
.chip:hover{background:var(--ink);color:var(--chalk)}
.chip svg{width:14px;height:14px}

.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.venue-grid>div{min-width:0}
.venue-grid h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kesar-2);font-weight:700}
.venue-grid p{margin:0;color:var(--ink-2);font-size:15px}
.venue-grid p b{color:var(--ink);font-weight:600}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field input,.field select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:0;padding:11px 12px;width:100%}
.field input::placeholder{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;padding:7px 12px;border:2px solid var(--ink);cursor:pointer;background:#fff}
.checks input{accent-color:var(--kesar);margin:0}
.checks label:has(input:checked){background:var(--ink);color:var(--chalk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;color:var(--chalk);background:var(--kesar);border:2px solid var(--kesar);border-radius:0;padding:14px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.btn:hover{background:var(--kesar-2);border-color:var(--kesar-2)}
.btn svg{width:18px;height:18px}
.rsvp-foot{font-size:14px;color:var(--ink-2);margin:0}
.rsvp-foot code{font-family:inherit;color:var(--ink);user-select:all;-webkit-user-select:all;font-weight:600}
.copy{font:inherit;font-size:13px;color:var(--kesar-2);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline;font-weight:600}
.msg{margin:0;padding:12px 14px;border-left:3px solid var(--haldi);background:var(--chalk-2);color:var(--ink-2);font-size:14px;white-space:pre-wrap;font-family:inherit}

.closing{padding-block:40px 8px;border-top:3px solid var(--ink);margin-top:30px}
.closing .hindi{font-family:var(--hindi);font-size:19px;color:var(--kesar-2);margin:0 0 6px}
.closing p{margin:0;color:var(--ink-2);max-width:48ch}
.closing .sig{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);margin-top:14px;letter-spacing:-.01em}

@media (max-width:460px){
  .families,.venue-grid,.row{grid-template-columns:1fr}
  .fn{grid-template-columns:64px 1fr;gap:0 12px}
  .fn .when .d{font-size:42px}
  .opener{padding-top:56px}
}
</style>
<!--DECOR-->
<div class="band" id="band" aria-hidden="true"></div>
<!--SCRIPT-->
<script>
/* Size the vermilion band to the opener, place the marquee strip under it, and shrink the names to fit the column. */
(() => {
  const page = document.querySelector(".page"), opener = document.querySelector(".opener"), band = document.getElementById("band");
  const strip = document.createElement("div"); strip.className = "strip"; strip.setAttribute("aria-hidden","true");
  const spacer = document.createElement("div"); spacer.className = "strip-spacer";
  document.body.appendChild(strip); opener.insertAdjacentElement("afterend", spacer);
  const fitNames = () => { for (const n of document.querySelectorAll(".names .n")) { n.style.fontSize = ""; const sw = n.scrollWidth, cw = n.clientWidth; if (sw > cw) n.style.fontSize = (parseFloat(getComputedStyle(n).fontSize) * cw / sw * .98) + "px"; } };
  const fit = () => { fitNames(); const bottom = page.getBoundingClientRect().top + scrollY + opener.offsetTop + opener.offsetHeight; band.style.height = bottom + "px"; strip.style.top = bottom + "px"; spacer.style.height = strip.offsetHeight + "px"; };
  const fill = () => {
    const a = document.getElementById("nameA").textContent, b = document.getElementById("nameB").textContent, d = document.getElementById("mainDate").textContent;
    const unit = `<span class="dn">${CONFIG.blessing}</span> &nbsp;·&nbsp; ${a} &amp; ${b} &nbsp;·&nbsp; ${d} &nbsp;·&nbsp; ${CONFIG.city} &nbsp;·&nbsp; `;
    strip.innerHTML = `<div class="track">${unit.repeat(4)}</div>`; fit();
  };
  fill(); addEventListener("hashchange", () => setTimeout(fill)); addEventListener("resize", fit); addEventListener("load", fit);
  if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
