<title>Shahi Raat Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Albert+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* SHAHI RAAT. Layout: one centred column on aubergine night. A gold emblem draws itself, the names rise in, embers drift up like sparks off a diya. Gold is the only accent. */
:root{
  --bg:#1a0912; --fg:#f4ead6; --fg-2:#cdbd9f; --mute:#9a846f;
  --accent:#d9b563; --accent-2:#f0d99c; --line:rgba(217,181,99,.28);
  --surface:#25101b; --on-accent:#2a0d1a;
  --display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Albert Sans","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:dark;
}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 85% 55% at 50% -8%,rgba(176,62,84,.40),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 108%,rgba(217,181,99,.10),transparent 70%);animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.6}to{opacity:1}}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.names .n{background:linear-gradient(172deg,#f8e6b0 0%,#dcb866 45%,#b9913f 72%,#f1d99b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.1em}
.names .n{font-weight:500}
.emblem{display:block;width:92px;height:92px;margin:0 auto 26px;color:var(--accent);animation:spin 120s linear infinite}
.emblem *{fill:none;stroke:currentColor;stroke-width:.8;stroke-linejoin:round;animation:draw 2.4s cubic-bezier(.45,0,.2,1) both;animation-delay:calc(var(--i,0) * .45s + .15s)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<!--DECOR-->
<div class="glow" aria-hidden="true"></div>
<canvas id="embers" aria-hidden="true"></canvas>
<!--SCRIPT-->
<script>
(() => {
  document.querySelector(".opener").insertAdjacentHTML("afterbegin", ORN.mandalaSVG(92));
  ORN.sparks(document.getElementById("embers"), { color: "217,181,99", count: 34 });
})();
</script>
