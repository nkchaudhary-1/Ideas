<title>Shahi Raat Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Albert+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* SHAHI RAAT. Layout: a night in the palace. The moon rises behind three layers of skyline, stars twinkle, diyas burn in the foreground,
   fireworks answer the countdown. Gold on deep aubergine is the only palette; every chapter is the same night at a different hour. */
:root{
  --bg:#0f0819; --fg:#f4ead6; --fg-2:#cdbd9f; --mute:#9a846f;
  --accent:#e0b862; --accent-2:#f0d99c; --line:rgba(224,184,98,.3);
  --surface:#1b0f2a; --on-accent:#2a0d1a;
  --display:"Cormorant Garamond","Cormorant",Georgia,serif; --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Albert Sans","Helvetica Neue",Arial,sans-serif; --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  --hud-ink:#2a0d1a; --hud-paper:#f4ead6; --hint:#f0d99c; --ld-bg:#0c0615; --ld-fg:#f4ead6;
  --vows-bg:#0c0616; --vows-fg:#f6ecd8; --vows-fg-2:#cdbd9f;
  --cel-bg:#190b22; --cel-fg:#f4ead6; --cel-fg-2:#cdbd9f; --cel-accent:#e0b862; --cel-on:#2a0d1a;
  --mq-bg:#e0b862; --mq-fg:#2a0d1a; --fin-bg:#0c0615; --fin-fg:#f4ead6; --fin-fg-2:#a88f7a;
  --title-color:#f3e3b8; --grain:.09;
  --moon-a:#fff6e0; --moon-b:#e7d3a8; --moon-glow:#f3dca0; --win:#ffc86a; --flame-glow:#ffb347; --dy1:#c26a2c; --dy2:#7e3a16; --dy-rim:#e8b866;
  color-scheme:dark;
}
.sky{position:absolute;inset:0}
.hero .sky{background:linear-gradient(180deg,#05030f 0%,#140a2a 34%,#3a1636 68%,#7c2d41 100%)}
.vows .sky{background:linear-gradient(180deg,#04020c 0%,#0d0720 52%,#26102e 100%)}
.celebrate .sky{background:linear-gradient(180deg,#190b22 0%,#240d2c 60%,#34123c 100%)}
.finale .sky{background:linear-gradient(180deg,#05030f 0%,#150b2b 38%,#47193a 76%,#8a3445 100%)}
.stars{position:absolute;left:0;top:0;width:100%;height:78%}
.layer>div{height:100%}
.layer.moon{top:auto;left:auto;right:clamp(12px,11vw,190px);bottom:clamp(120px,21vh,250px);width:clamp(130px,19vw,260px)}
.layer.moon>svg{height:auto}
.layer.sk{height:clamp(190px,36vh,430px)}
.sk-far{bottom:clamp(70px,17vh,180px)}.sk-mid{bottom:clamp(24px,8vh,96px)}.sk-near{bottom:0}
.layer.fog{bottom:0;height:62%}.mist{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(160,55,85,.34) 100%)}
.hero .wins path{animation:win 6s ease-in-out infinite;animation-delay:calc(var(--d) * -6s)}
@keyframes win{0%,100%{opacity:.5}50%{opacity:1}}
.layer.lamps{bottom:clamp(6px,2.4vh,26px);height:auto}
.lamps-in{display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(10px,5vw,90px);height:auto!important}
.lamp{width:clamp(56px,9vw,120px)}
.vows .layer.moon{top:7vh;bottom:auto;width:clamp(100px,13vw,170px)}
.vows .layer.sk{height:clamp(150px,28vh,330px)}

/* gold lettering: a vertical gradient on every character */
@supports (background-clip:text) or (-webkit-background-clip:text){
  .t .in,.n .in,.fin-hindi .in{background:linear-gradient(172deg,#f9e8b4 0%,#e0bb68 46%,#b9913f 74%,#f1d99b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
}
.mq-sep{background:var(--mq-fg)}
.celebrate .fn h3{font-weight:500}

/* sky lanterns drifting up the celebration */
.lantern{position:absolute;bottom:-14%;left:var(--x);width:var(--s);animation:lift var(--t) linear infinite;animation-delay:var(--dl);opacity:0}
.lantern svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes lift{0%{transform:translate(0,0);opacity:0}8%{opacity:.95}50%{transform:translate(var(--dx),-60vh)}92%{opacity:.9}100%{transform:translate(calc(var(--dx) * -.6),-130vh);opacity:0}}
.celebrate .layer.lan{inset:0;height:100%}
</style>
<!--DECOR-->
<!--SCRIPT-->
<script>
(() => {
  const $ = s => document.querySelector(s), W = Math.round(Math.max(innerWidth * 1.15, 900));
  const sk = (seed, fill, o = {}) => ILL.skyline({ w: W, h: 300, seed, fill, lit: "#ffc86a", ...o });
  document.documentElement.style.setProperty("--jali", ILL.jali("#e0b862", .26));
  const lamp = () => `<div class="lamp">${ILL.diya()}</div>`;
  const lanternSvg = '<svg viewBox="0 0 60 96" aria-hidden="true"><defs><radialGradient id="lnG" cx=".5" cy=".72"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#ff9d3c"/><stop offset="1" stop-color="#c8501e"/></radialGradient><radialGradient id="lnH"><stop offset="0" stop-color="#ffb04a" stop-opacity=".45"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient></defs><circle cx="30" cy="60" r="46" fill="url(#lnH)"/><path d="M14,14Q30,2 46,14L52,64Q30,80 8,64Z" fill="url(#lnG)"/><path d="M14,14Q30,26 46,14" fill="none" stroke="#7a2c12" stroke-opacity=".5"/><path d="M20,18L16,66M30,22V74M40,18L44,66" stroke="#7a2c12" stroke-opacity=".25" fill="none"/><ellipse cx="30" cy="78" rx="9" ry="3.2" fill="#ffd27a"/></svg>';
  const lanterns = n => Array.from({ length: n }, (_, i) => { const r = ILL.rng(i * 7 + 3); return `<div class="lantern" style="--x:${Math.round(r() * 88 + 4)}%;--s:${Math.round(26 + r() * 30)}px;--t:${Math.round(22 + r() * 16)}s;--dl:${-Math.round(r() * 30)}s;--dx:${Math.round(r() * 80 - 40)}px">${lanternSvg}</div>`; }).join("");
  const skylines = (a, b, c, scale = 1) => `
    <div class="layer sk sk-far" data-depth=".16"><div style="opacity:.62">${sk(a, "#35194b", { windows: false, scale: scale * 1.15 })}</div></div>
    <div class="layer fog" data-depth=".22"><div class="mist"></div></div>
    <div class="layer sk sk-mid" data-depth=".34"><div style="opacity:.88">${sk(b, "#220f37")}</div></div>
    <div class="layer sk sk-near" data-depth=".55"><div>${sk(c, "#110620", { scale: scale * 1.1 })}</div></div>`;

  $("#sceneHero").innerHTML = `<div class="sky"></div><canvas class="stars"></canvas><div class="layer moon" data-depth=".06">${ILL.moon(300)}</div>${skylines(3, 11, 21)}<div class="layer lamps" data-depth=".85"><div class="lamps-in">${lamp()}${lamp()}</div></div>`;
  $("#sceneVows").innerHTML = `<div class="sky"></div><canvas class="stars"></canvas><div class="layer moon" data-depth=".1">${ILL.moon(200)}</div><div class="layer sk sk-near" data-depth=".5"><div>${sk(31, "#0b0415", { scale: 1 })}</div></div>`;
  $("#sceneCel").innerHTML = `<div class="sky"></div><canvas class="stars"></canvas><div class="layer lan" data-depth=".6"><div>${lanterns(7)}</div></div>`;
  $("#sceneFin").innerHTML = `<div class="sky"></div><canvas class="stars"></canvas><div class="layer moon" data-depth=".08">${ILL.moon(300)}</div>${skylines(41, 47, 53)}<div class="layer lan" data-depth=".6" style="top:0;bottom:0"><div>${lanterns(5)}</div></div>`;
  document.querySelectorAll(".stars").forEach(c => FX.stars(c, { count: 130, band: .8 }));

  let idle = 0;
  EXP.init({
    tones: { hero: "paper", vows: "paper", celebrate: "paper", finale: "paper" },
    fx: { additive: true },
    ambient() { FX.ambient({ kind: "embers", color: "224,184,98", count: 22 }); clearInterval(idle); idle = setInterval(() => { if (!document.hidden && scrollY < innerHeight * .5) FX.salvo(1); }, 9000); },
    heroIn() { setTimeout(() => FX.salvo(2), 900); },
    vows(tl, { dur }) {
      const moon = $("#sceneVows .layer.moon");
      tl.fromTo(moon, { x: () => innerWidth * .12, y: () => innerHeight * .28 }, { x: () => -innerWidth * .72, y: () => -innerHeight * .04, ease: "none", duration: dur }, 0);
      tl.fromTo("#sceneVows .wins path", { opacity: 0 }, { opacity: 1, duration: .5, ease: "none", stagger: { amount: dur * .8, from: "random" } }, 0);
    },
    celebrate() { FX.salvo(4); },
    shower(x, y, n) { FX.firework(x, y); if (n % 3 === 0) FX.salvo(1); }
  });
})();
</script>
