<title>Shahi Raat Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Albert+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* SHAHI RAAT. Layout: a maroon-and-gold card. Marigold toran across the top, gold mandala behind the names, paisley corners on a double gold frame, gold-ruled panels. */
:root{
  --maroon:#3a0a16; --maroon-2:#4d101f; --maroon-3:#64182b; --wine:#2a0710;
  --gold:#d9b25a; --gold-2:#f3dc8f; --gold-3:#a8812e; --gold-line:rgba(217,178,90,.45);
  --ivory:#f7ecd6; --ivory-2:#d9c7a8; --mute:#a88f6e;
  --gold-grad:linear-gradient(170deg,#f7e39a 0%,#d9b25a 35%,#a8812e 60%,#f3dc8f 100%);
  --display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --body:"Albert Sans","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wine);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#5a1326 0%,var(--wine) 60%)}
.bg::after{content:"";position:absolute;inset:0;background-image:var(--bandhani);opacity:.5}
.page{position:relative;z-index:1;overflow:hidden;max-width:620px;margin:20px auto 40px;padding-block:0 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;background:var(--maroon);border:1px solid var(--gold);box-shadow:inset 0 0 0 5px var(--maroon),inset 0 0 0 6px var(--gold-line),0 30px 60px rgba(0,0,0,.45)}
@media (min-width:640px){.page{padding-inline:36px}}
.corner{position:absolute;width:74px;height:98px;z-index:2;pointer-events:none;opacity:.9}
.corner.tl{top:8px;left:8px}.corner.tr{top:8px;right:8px;transform:scaleX(-1)}.corner.bl{bottom:8px;left:8px;transform:scaleY(-1)}.corner.br{bottom:8px;right:8px;transform:scale(-1)}
.corner svg{width:100%;height:100%}
a{color:var(--gold-2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.dn{font-family:var(--hindi);color:var(--gold);font-weight:400}

.preview{align-self:center;display:inline-flex;gap:4px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ivory-2);background:var(--wine);border:1px solid var(--gold-line);padding:3px 4px 3px 12px;border-radius:999px;position:relative;z-index:3;margin-top:14px}
.preview a{text-decoration:none;color:var(--ivory);padding:4px 10px;border-radius:999px}
.preview a[aria-current="page"]{background:var(--gold);color:var(--maroon);font-weight:600}

.toran{display:block;width:100%;height:200px;margin:0 0 -118px}
.opener{position:relative;text-align:center;padding-block:10px 24px}
.mandala{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,120%);aspect-ratio:1;max-width:none;pointer-events:none;opacity:.55}
.opener>*{position:relative}
.opener .mandala,.opener .arch{position:absolute}
.opener .hindi{font-family:var(--hindi);font-size:22px;color:var(--gold);margin:0 0 10px;letter-spacing:.04em}
.opener .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ivory-2);margin:0 auto 22px;max-width:44ch;line-height:1.7}
.names{font-family:var(--display);font-weight:500;font-size:clamp(50px,13vw,84px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.names .n{display:block;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.names .amp{display:block;font-style:italic;font-size:.4em;color:var(--gold);margin:4px 0;font-weight:400}
.opener .date{font-family:var(--display);font-size:24px;margin:22px 0 4px;font-weight:500;color:var(--ivory)}
.opener .place{color:var(--ivory-2);margin:0}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:20px;padding:9px 18px;border:1px solid var(--gold);border-radius:999px;color:var(--ivory-2);font-size:13px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 0 3px var(--maroon),0 0 0 4px var(--gold-line)}
.countdown b{font-family:var(--display);font-size:26px;color:var(--gold-2);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:0}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin:26px auto 0;max-width:320px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
.motif{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);box-shadow:0 0 0 3px var(--maroon),0 0 0 4px var(--gold)}

.card{position:relative;background:var(--maroon-2);border:1px solid var(--gold-line);padding:26px 22px}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg);background:var(--maroon)}
.card::before{top:-6px;left:50%;margin-left:-5px}.card::after{bottom:-6px;left:50%;margin-left:-5px}
.card h2{font-family:var(--display);font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:.01em;color:var(--gold-2);text-wrap:balance}
.card .lead{color:var(--ivory-2);margin:0 0 18px;max-width:52ch}
.invite-text{font-family:var(--display);font-size:21px;line-height:1.45;max-width:40ch;margin:0 auto;text-align:center}
.invite-text em{font-style:italic;color:var(--gold-2)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fn{display:grid;grid-template-columns:60px 1fr;gap:0 16px;padding-block:18px;border-top:1px solid rgba(217,178,90,.2)}
.fn:first-child{border-top:0;padding-top:4px}
.fn .what{min-width:0}
.fn .when{width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);box-shadow:inset 0 0 0 3px var(--maroon-2),inset 0 0 0 4px var(--gold-line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold-2)}
.fn .when .d{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;font-weight:600}
.fn .when .m{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.fn h3{margin:0;font-family:var(--display);font-weight:600;font-size:25px;color:var(--ivory)}
.fn h3 .dn{font-size:17px;margin-left:8px;font-weight:400}
.fn .meta{margin:3px 0 0;color:var(--ivory-2);font-size:15px}
.fn .meta b{color:var(--ivory);font-weight:500}
.fn .note{margin:8px 0 0;color:var(--mute);font-size:14px}
.fn .dress{font-size:14px;color:var(--ivory-2);margin:8px 0 0}
.fn .dress b{color:var(--gold);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:6px}
.fn .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold-2);text-decoration:none;border:1px solid var(--gold-line);padding:6px 11px;border-radius:999px}
.chip:hover{border-color:var(--gold);background:var(--maroon-3)}
.chip svg{width:14px;height:14px}

.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.venue-grid>div{min-width:0}
.venue-grid h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
.venue-grid p{margin:0;color:var(--ivory-2);font-size:15px}
.venue-grid p b{color:var(--ivory);font-weight:500}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--ivory-2)}
.field input,.field select{font:inherit;color:var(--ivory);background:var(--wine);border:1px solid var(--gold-line);border-radius:4px;padding:11px 12px;width:100%}
.field input::placeholder{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:8px 12px;border:1px solid var(--gold-line);border-radius:999px;cursor:pointer;background:var(--wine)}
.checks input{accent-color:var(--gold);margin:0}
.checks label:has(input:checked){border-color:var(--gold);color:var(--gold-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;color:var(--maroon);background:var(--gold-grad);border:0;border-radius:4px;padding:14px 18px;cursor:pointer;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px}
.rsvp-foot{font-size:14px;color:var(--ivory-2);margin:0}
.rsvp-foot code{font-family:inherit;color:var(--ivory);user-select:all;-webkit-user-select:all}
.copy{font:inherit;font-size:13px;color:var(--gold-2);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline}
.msg{margin:0;padding:12px 14px;border-left:2px solid var(--gold);background:var(--wine);color:var(--ivory-2);font-size:14px;white-space:pre-wrap;font-family:inherit}

.closing{text-align:center;padding-block:26px 8px}
.closing .hindi{font-family:var(--hindi);font-size:20px;color:var(--gold);margin:0 0 6px}
.closing p{margin:0;color:var(--ivory-2)}
.closing .sig{font-family:var(--display);font-style:italic;font-size:24px;color:var(--gold-2);margin-top:14px}

/* lineage, sign-off and event copy */
.names .n{margin:0;font:inherit}
.names .person{display:block}
.names .amp{margin:16px 0}
.lineage{font-family:var(--body);font-size:14px;line-height:1.55;font-weight:400;font-style:normal;letter-spacing:.01em;color:var(--ivory-2);margin:10px auto 0;max-width:44ch;text-shadow:none}
.opener .hindi small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-2);margin-top:6px}
.signoff{margin-top:22px;text-align:center;border-top:1px solid var(--gold-line);padding-top:16px}
.signoff .warm{margin:0;color:var(--ivory-2);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.signoff .fam{margin:6px 0 0;font-family:var(--display);font-style:italic;font-size:26px;text-wrap:balance;line-height:1.2;color:var(--gold-2)}
.signoff .city{margin:6px 0 0;color:var(--ivory-2);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.fn .headline{margin:6px 0 0;font-family:var(--display);font-style:italic;font-size:20px;color:var(--gold-2);line-height:1.3}
.fn .evtext{margin:8px 0 0;color:var(--ivory-2);font-size:15px;max-width:52ch}
.closing:empty{display:none}

@media (max-width:460px){
  .venue-grid,.row{grid-template-columns:1fr}
  .card{padding:22px 16px}
  .fn{grid-template-columns:52px 1fr;gap:0 12px}
  .fn .when{width:52px;height:52px}.fn .when .d{font-size:22px}
  .toran{height:170px;margin-bottom:-100px}
  .corner{width:54px;height:72px}
  .page{margin:10px auto 28px}
}
</style>
<!--DECOR-->
<div class="bg" aria-hidden="true"></div>
<!--SCRIPT-->
<script>
(() => {
  const page = document.querySelector(".page"), opener = document.querySelector(".opener");
  document.documentElement.style.setProperty("--bandhani", `url(${ORN.bandhani("rgba(217,178,90,.16)", 34)})`);
  for (const c of ["tl","tr","bl","br"]) { const d = document.createElement("div"); d.className = "corner " + c; d.innerHTML = ORN.paisleySVG("#d9b25a"); d.setAttribute("aria-hidden","true"); page.appendChild(d); }
  const toran = document.createElement("canvas"); toran.className = "toran"; toran.setAttribute("aria-hidden","true");
  page.insertBefore(toran, opener);
  const m = document.createElement("canvas"); m.className = "mandala"; m.setAttribute("aria-hidden","true"); opener.insertBefore(m, opener.firstChild);
  const draw = () => {
    ORN.toran(toran, { tassels: true });
    const dpr = Math.min(devicePixelRatio || 1, 2); const s = m.clientWidth; m.width = s * dpr; m.height = s * dpr;
    const ctx = m.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,s,s);
    ORN.mandala(ctx, s/2, s/2, s*.48, "#d9b25a", { n: 16, lineWidth: 1 });
  };
  draw(); addEventListener("resize", draw); addEventListener("hashchange", () => setTimeout(draw));
})();
</script>
