<title>Kesariya Invite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* KESARIYA. Layout: a saffron block-printed ground, a maroon card with a huge gold mandala behind the names, Yatra One display, gold-ruled panels and big saffron dates. */
:root{
  --kesar:#e8912a; --kesar-2:#f4b04a; --kesar-3:#b86a14;
  --maroon:#5a0f1e; --maroon-2:#6c1526; --maroon-3:#7f1c30; --wine:#3f0914;
  --gold:#d9b25a; --gold-2:#f3dc8f; --gold-line:rgba(217,178,90,.5);
  --ivory:#fbefdc; --ivory-2:#e2cfae; --mute:#b3966f;
  --display:"Yatra One","Tiro Devanagari Hindi",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--kesar);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--boota);background-size:96px 96px}
.page{position:relative;z-index:1;overflow:hidden;max-width:640px;margin:22px auto 44px;background:var(--maroon);border:2px solid var(--gold);box-shadow:inset 0 0 0 6px var(--maroon),inset 0 0 0 7px var(--gold-line),0 26px 50px rgba(60,10,0,.35);padding-block:0 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
@media (min-width:640px){.page{padding-inline:36px}}
.corner{position:absolute;width:70px;height:94px;z-index:2;pointer-events:none}
.corner.tl{top:9px;left:9px}.corner.tr{top:9px;right:9px;transform:scaleX(-1)}.corner.bl{bottom:9px;left:9px;transform:scaleY(-1)}.corner.br{bottom:9px;right:9px;transform:scale(-1)}
.corner svg{width:100%;height:100%}
a{color:var(--gold-2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.dn{font-family:var(--hindi);color:var(--kesar-2);font-weight:400}

.preview{align-self:center;display:inline-flex;gap:4px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ivory-2);border:1px solid var(--gold-line);padding:3px 4px 3px 12px;border-radius:999px;background:var(--wine);margin:16px 0 0;position:relative;z-index:3}
.preview a{text-decoration:none;color:var(--ivory);padding:4px 10px;border-radius:999px}
.preview a[aria-current="page"]{background:var(--kesar);color:var(--wine);font-weight:600}

.toran{display:block;width:100%;height:76px;margin:0 0 4px}
.opener{position:relative;text-align:center;padding-block:8px 28px}
.mandala{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(600px,135%);aspect-ratio:1;max-width:none;pointer-events:none;opacity:.42}
.opener>*{position:relative}
.opener .mandala,.opener .arch{position:absolute}
.opener .hindi{font-family:var(--display);font-size:24px;color:var(--kesar-2);margin:0 0 10px;letter-spacing:.02em}
.opener .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory-2);margin:0 auto 20px;max-width:44ch;line-height:1.7}
.names{font-family:var(--display);font-weight:400;font-size:clamp(46px,12.5vw,86px);line-height:1.05;margin:0;letter-spacing:.005em;text-wrap:balance;color:var(--gold-2);text-shadow:0 3px 0 var(--wine)}
.names .n{display:block}
.names .amp{display:block;font-family:var(--serif);font-style:italic;font-size:.38em;color:var(--kesar-2);margin:6px 0;text-shadow:none}
.opener .date{font-family:var(--serif);font-size:25px;margin:20px 0 2px;font-weight:600;color:var(--ivory)}
.opener .place{margin:0;font-size:15px;color:var(--ivory-2)}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:18px;padding:8px 16px;background:var(--kesar);color:var(--wine);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border:2px solid var(--gold);transform:rotate(-1.5deg)}
.countdown b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:400}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold);margin:26px auto 0;max-width:320px}
.rule::before,.rule::after{content:"";flex:1;height:3px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.motif{width:12px;height:12px;background:var(--kesar);transform:rotate(45deg);border:1px solid var(--gold)}

.card{position:relative;padding-block:30px 10px;border-top:1px solid var(--gold-line)}
.card.invite{border-top:0;padding-top:16px}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px;letter-spacing:.005em;color:var(--kesar-2);text-wrap:balance}
.card .lead{color:var(--ivory-2);margin:0 0 20px;max-width:52ch}
.invite-text{font-family:var(--serif);font-size:22px;max-width:40ch;margin:0 auto;line-height:1.45;text-align:center}
.invite-text em{font-style:italic;color:var(--kesar-2)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fn{display:grid;grid-template-columns:84px 1fr;gap:0 18px;padding-block:20px;border-top:1px solid rgba(217,178,90,.22)}
.fn:first-child{border-top:0;padding-top:0}
.fn .what{min-width:0}
.fn .when{font-family:var(--display);line-height:1;text-align:center}
.fn .when .d{font-size:54px;color:var(--kesar-2);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--wine)}
.fn .when .m{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:var(--body);font-weight:600;margin-top:4px}
.fn h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ivory)}
.fn h3 .dn{font-size:18px;margin-left:8px}
.fn .meta{margin:4px 0 0;color:var(--ivory-2);font-size:15px}
.fn .meta b{color:var(--ivory);font-weight:600}
.fn .note{margin:8px 0 0;color:var(--mute);font-size:14px}
.fn .dress{font-size:14px;color:var(--ivory-2);margin:8px 0 0}
.fn .dress b{display:inline-block;color:var(--wine);background:var(--kesar);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:1px 6px;margin-right:8px}
.fn .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--gold-2);text-decoration:none;border:1px solid var(--gold-line);padding:5px 10px}
.chip:hover{background:var(--maroon-3)}
.chip svg{width:14px;height:14px}

.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.venue-grid>div{min-width:0}
.venue-grid h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kesar-2);font-weight:700}
.venue-grid p{margin:0;color:var(--ivory-2);font-size:15px}
.venue-grid p b{color:var(--ivory);font-weight:600}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ivory-2);font-weight:600}
.field input,.field select{font:inherit;color:var(--ivory);background:var(--wine);border:1px solid var(--gold-line);border-radius:0;padding:11px 12px;width:100%}
.field input::placeholder{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;padding:7px 12px;border:1px solid var(--gold-line);cursor:pointer;background:var(--wine)}
.checks input{accent-color:var(--kesar);margin:0}
.checks label:has(input:checked){background:var(--kesar);color:var(--wine);border-color:var(--kesar)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;color:var(--wine);background:var(--kesar);border:2px solid var(--gold);border-radius:0;padding:14px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.btn:hover{background:var(--kesar-2)}
.btn svg{width:18px;height:18px}
.rsvp-foot{font-size:14px;color:var(--ivory-2);margin:0}
.rsvp-foot code{font-family:inherit;color:var(--ivory);user-select:all;-webkit-user-select:all;font-weight:600}
.copy{font:inherit;font-size:13px;color:var(--gold-2);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline;font-weight:600}
.msg{margin:0;padding:12px 14px;border-left:3px solid var(--kesar);background:var(--wine);color:var(--ivory-2);font-size:14px;white-space:pre-wrap;font-family:inherit}

.closing{text-align:center;padding-block:34px 8px;border-top:1px solid var(--gold-line);margin-top:26px}
.closing .hindi{font-family:var(--display);font-size:22px;color:var(--kesar-2);margin:0 0 6px}
.closing p{margin:0 auto;color:var(--ivory-2);max-width:48ch}
.closing .sig{font-family:var(--serif);font-style:italic;font-size:25px;color:var(--gold-2);margin-top:14px}

/* lineage, sign-off and event copy */
.names .n{margin:0;font:inherit}
.names .person{display:block}
.names .amp{margin:14px 0}
.lineage{font-family:var(--body);font-size:14px;line-height:1.55;font-weight:400;font-style:normal;letter-spacing:.01em;color:var(--ivory-2);margin:10px auto 0;max-width:44ch;text-shadow:none}
.opener .hindi small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-2);margin-top:6px}
.signoff{margin-top:22px;text-align:center;border-top:1px solid var(--gold-line);padding-top:16px}
.signoff .warm{margin:0;color:var(--ivory-2);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.signoff .fam{margin:6px 0 0;font-family:var(--display);font-size:26px;text-wrap:balance;line-height:1.2;color:var(--kesar-2)}
.signoff .city{margin:6px 0 0;color:var(--gold);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.fn .headline{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:21px;font-weight:600;color:var(--kesar-2);line-height:1.3}
.fn .evtext{margin:8px 0 0;color:var(--ivory-2);font-size:15px;max-width:52ch}

@media (max-width:460px){
  .venue-grid,.row{grid-template-columns:1fr}
  .fn{grid-template-columns:62px 1fr;gap:0 12px}
  .fn .when .d{font-size:42px}
  .toran{height:64px;margin-bottom:2px}
  .corner{width:52px;height:70px}
  .page{margin:10px auto 30px}
}
</style>
<div class="bg" aria-hidden="true"></div>
<main class="page">
  <nav class="preview" id="previewBar" hidden aria-label="Preview">
    <span>Preview as</span>
    <a href="#groom" id="pvGroom">Groom's side</a>
    <a href="#bride" id="pvBride">Bride's side</a>
  </nav>

  <header class="opener">
    <p class="hindi" id="blessing"></p>
    <p class="eyebrow" id="eyebrow"></p>
    <div class="names">
      <div class="person"><h1 class="n" id="nameA"></h1><p class="lineage" id="lineA"></p></div>
      <span class="amp" id="joiner"></span>
      <div class="person"><h2 class="n" id="nameB"></h2><p class="lineage" id="lineB"></p></div>
    </div>
    <p class="date" id="mainDate"></p>
    <p class="place" id="mainPlace"></p>
    <div class="countdown" id="countdown"></div>
    <div class="rule" aria-hidden="true"><span class="motif"></span></div>
  </header>

  <section class="card invite">
    <p class="invite-text" id="inviteText"></p>
    <div class="signoff">
      <p class="warm" id="signWarm"></p>
      <p class="fam" id="signFam"></p>
      <p class="city" id="signCity"></p>
    </div>
  </section>

  <section class="card" id="functions">
    <h2 id="fnTitle"></h2>
    <p class="lead" id="fnLead"></p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="card" id="venue" hidden>
    <h2>Getting there and staying</h2>
    <p class="lead" id="venueLead"></p>
    <div class="venue-grid" id="venueGrid"></div>
  </section>

  <section class="card" id="rsvp" hidden>
    <h2>Will you be there?</h2>
    <p class="lead">Fill this in and send it to us on WhatsApp. It takes a few seconds and helps us plan the food and the rooms.</p>
    <form class="form" id="rsvpForm" novalidate>
      <div class="field"><label for="rName">Your name</label><input id="rName" name="name" autocomplete="name" placeholder="As we know you" required></div>
      <div class="row">
        <div class="field"><label for="rCount">Guests, including you</label>
          <select id="rCount" name="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></div>
        <div class="field"><label for="rCity">Coming from</label><input id="rCity" name="city" placeholder="City"></div>
      </div>
      <div class="field"><span class="flabel">Which functions?</span><div class="checks" id="rFns"></div></div>
      <div class="field"><label for="rNote">Anything we should know?</label><input id="rNote" name="note" placeholder="Food, travel dates, a song for the celebration"></div>
      <pre class="msg" id="rPreview" hidden></pre>
      <button class="btn" type="submit" id="rSend">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.1.6 2.8.5a2.4 2.4 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c0-.2-.2-.2-.5-.3z"/></svg>
        Send RSVP on WhatsApp
      </button>
      <p class="rsvp-foot">If WhatsApp doesn't open, message <code id="rPhone"></code> <button type="button" class="copy" id="copyPhone">copy number</button></p>
    </form>
  </section>

  <footer class="closing">
    <p class="hindi" id="closingHindi"></p>
    <p id="closingLine"></p>
    <p class="sig" id="closingSig"></p>
  </footer>
</main>

<script>
/* =====================================================================
   CONFIG: every template reads this. Edit this file only.
   Dates are YYYY-MM-DD, times are 24h "HH:MM".
   `side` picks whose copy of the invitation this is: "groom" or "bride".
   The host side lists its own name, lineage and family first. In the URL,
   #groom or #bride overrides it. Set preview:false before sending: it hides the side switch.
   In event text, {host} and {other} become the first names, host side first.
   ===================================================================== */
const CONFIG = {
  preview: true,
  side: "groom",
  blessing: "॥ श्री गणेशाय नमः ॥",
  blessingEn: "Shri Ganeshaya Namah",
  intro: "With the blessings of the Almighty and our beloved elders,<br>We cordially invite you to celebrate the auspicious wedding ceremony of",
  joiner: "with",
  groom: {
    name: "Neelesh Kumar",
    lineage: ["Grandson of Late Shri Kisan Lal", "Son of Shri Vijay Kumar & Smt. Archana Devi"],
    family: "Kumar Family",
    whatsapp: ""            // country code + number, digits only, e.g. "919876543210". Empty hides the RSVP card.
  },
  bride: {
    name: "Pragyaniti",
    lineage: ["Granddaughter of Late Shri Budh Lal", "Daughter of Shri Anil Kumar & Smt. Pushpa"],
    family: "Pushpa Family",
    whatsapp: ""
  },
  city: "Prayagraj",
  inviteText: "As they embark on a beautiful journey of togetherness.<br>Your gracious presence and blessings will make this occasion truly special.",
  signoff: "With warm regards,",
  functionsTitle: "The celebration",
  functions: [
    {
      side: "both",
      name: "Wedding & Baraat Welcome",
      date: "2026-12-11", time: "21:00", timeText: "9:00 PM onwards",
      venue: "", address: "",     // add the venue and address when confirmed; add map:"https://maps.google.com/?q=..." for a Maps button
      headline: "The day we've all been waiting for!",
      body: "With immense joy, we invite you to celebrate the wedding of {host} & {other}. Join us to welcome the Baraat and bless the couple as they begin their beautiful journey together.",
      note: "Your presence and blessings will make this occasion unforgettable."
    }
  ],
  travel: [],                    // optional cards: [{ h:"Nearest airport", p:"<b>...</b> ..." }]. Empty hides the section.
  venueLead: "",
  closingHindi: "॥ श्री गणेशाय नमः ॥",
  closingLine: "",
  closingSig: ""
};

</script>
<script>
/* Procedural traditional ornament. Every template draws from this: nothing is a stock image.
   ORN.mandala(ctx, cx, cy, r, color, opts)     gold mandala, 12- or 16-fold
   ORN.toran(canvas, color)                      marigold garland strings hanging from the top edge
   ORN.blockPrint(colors, size)                  data URL tile of a boota (block-print flower) for CSS backgrounds
   ORN.bandhani(color, size)                     data URL tile of tie-dye dots
   ORN.paisleySVG(color)                         an SVG string of a paisley with inner curls (corner ornament)
   ORN.archPath(w, h, cusps)                     SVG path of a cusped (Mughal) arch                                */
const ORN = (() => {
  const TAU = Math.PI * 2;

  function petal(ctx, cx, cy, ang, len, wid, pointed = true) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0);
    if (pointed) { ctx.bezierCurveTo(wid, len * .35, wid, len * .75, 0, len); ctx.bezierCurveTo(-wid, len * .75, -wid, len * .35, 0, 0); }
    else { ctx.ellipse(0, len / 2, wid, len / 2, 0, 0, TAU); }
    ctx.closePath(); ctx.restore();
  }

  function mandala(ctx, cx, cy, r, color, o = {}) {
    const n = o.n || 16, lw = o.lineWidth || 1;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineJoin = "round";
    const ring = (rad, w = lw, dash) => { ctx.beginPath(); ctx.setLineDash(dash || []); ctx.lineWidth = w; ctx.arc(cx, cy, rad, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = lw; };
    const petals = (rad, len, wid, count, off = 0, fill = 0, pointed = true) => {
      for (let i = 0; i < count; i++) { petal(ctx, cx, cy, off + i * TAU / count, len, wid, pointed);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(off + i * TAU / count); ctx.translate(0, rad); ctx.rotate(-(off + i * TAU / count)); ctx.restore();
      }
    };
    const petalsAt = (rad, len, wid, count, off = 0, fill = 0, pointed = true) => {
      for (let i = 0; i < count; i++) { const a = off + i * TAU / count;
        ctx.save(); ctx.translate(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); ctx.rotate(a - Math.PI / 2);
        petal(ctx, 0, 0, 0, len, wid, pointed); if (fill) { ctx.globalAlpha = fill; ctx.fill(); ctx.globalAlpha = 1; } ctx.stroke(); ctx.restore(); }
    };
    const dots = (rad, count, size, off = 0) => { for (let i = 0; i < count; i++) { const a = off + i * TAU / count; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, size, 0, TAU); ctx.fill(); } };
    // outer scalloped edge
    ring(r); ring(r * .96, lw * .6);
    petalsAt(r * .96, -r * .16, r * .055, n, 0, .12);
    dots(r * .83, n, lw * 1.4, TAU / n / 2);
    ring(r * .78, lw * .6, [lw * 3, lw * 3]);
    petalsAt(r * .42, r * .33, r * .07, n, TAU / n / 2, .1);
    petalsAt(r * .42, r * .24, r * .05, n, 0, .18);
    ring(r * .44);
    dots(r * .5, n * 2, lw * .9);
    petalsAt(r * .12, r * .26, r * .07, n / 2, 0, .22);
    petalsAt(r * .08, r * .16, r * .05, n / 2, TAU / n, .35);
    ring(r * .1, lw * .8); ctx.beginPath(); ctx.arc(cx, cy, r * .035, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function marigold(ctx, x, y, r, hueA, hueB) {
    const g = ctx.createRadialGradient(x - r * .2, y - r * .2, r * .1, x, y, r);
    g.addColorStop(0, hueB); g.addColorStop(1, hueA);
    ctx.fillStyle = g; ctx.beginPath();
    const k = 14; for (let i = 0; i <= k * 4; i++) { const a = i / (k * 4) * TAU; const rr = r * (0.82 + 0.18 * Math.abs(Math.sin(a * k / 2))); ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(120,50,0,.35)"; ctx.beginPath();
    for (let i = 0; i <= k * 4; i++) { const a = i / (k * 4) * TAU; const rr = r * .5 * (0.8 + 0.2 * Math.abs(Math.sin(a * k / 2 + 1))); ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }
  function leaf(ctx, x, y, ang, len, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * .28, len * .45, 0, len); ctx.quadraticCurveTo(-len * .28, len * .45, 0, 0); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(0, len * .08); ctx.lineTo(0, len * .92); ctx.stroke(); ctx.restore();
  }

  /* Garland strings across the top of the canvas, with hanging tassels at both ends. */
  function toran(c, opts = {}) {
    const ctx = c.getContext("2d"); const dpr = Math.min(devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const orange = opts.orange || "#e5781c", yellow = opts.yellow || "#f6b63a", green = opts.green || "#3f7a3a", greenDark = opts.greenDark || "#2c5a2a";
    const fr = Math.max(7, Math.min(11, W / 48)); // flower radius
    const span = fr * 9.5; const n = Math.max(2, Math.round(W / span)); const seg = W / n; const sag = Math.min(70, seg * .32);
    const place = (x, y, i) => { if (i % 3 === 2) { leaf(ctx, x, y - fr * .3, Math.PI * .9, fr * 2, i % 2 ? green : greenDark); leaf(ctx, x, y - fr * .3, Math.PI * 1.1, fr * 2, green); } marigold(ctx, x, y, fr * (i % 2 ? .95 : 1.05), orange, yellow); };
    // strings
    ctx.strokeStyle = "rgba(60,30,0,.55)"; ctx.lineWidth = 1.2;
    for (let s = 0; s < n; s++) { const x0 = s * seg, x1 = (s + 1) * seg; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.quadraticCurveTo((x0 + x1) / 2, sag * 2, x1, 0); ctx.stroke(); }
    // flowers along each curve
    for (let s = 0; s < n; s++) { const x0 = s * seg, x1 = (s + 1) * seg; const cnt = Math.round(seg / (fr * 1.5));
      for (let i = 0; i <= cnt; i++) { const t = i / cnt; const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * (x0 + x1) / 2 + t * t * x1; const y = 2 * (1 - t) * t * sag * 2; place(x, y + fr * .2, i + s); } }
    // tassels at the ends
    const tassel = (x) => { ctx.strokeStyle = "rgba(60,30,0,.55)"; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - fr * 2.2); ctx.stroke();
      const cnt = Math.floor((H - fr * 2.4) / (fr * 1.5)); for (let i = 0; i < cnt; i++) place(x, fr * .9 + i * fr * 1.5, i + 1);
      leaf(ctx, x, H - fr * 2.4, Math.PI * .08, fr * 2.2, green); leaf(ctx, x, H - fr * 2.4, -Math.PI * .08, fr * 2.2, greenDark); };
    if (opts.tassels !== false && H > fr * 5) { tassel(fr * 1.4); tassel(W - fr * 1.4); }
  }

  function tile(size, draw) { const c = document.createElement("canvas"); const s = 2; c.width = size * s; c.height = size * s; const ctx = c.getContext("2d"); ctx.scale(s, s); draw(ctx, size); return c.toDataURL("image/png"); }

  /* Boota: a block-print flower with stem and two leaves, in a half-drop grid. */
  function blockPrint(colors, size = 96) {
    return tile(size, (ctx, S) => {
      const boota = (x, y, sc) => { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
        ctx.strokeStyle = colors.leaf; ctx.lineWidth = 1.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(0, 10); ctx.quadraticCurveTo(2, 20, 0, 30); ctx.stroke();
        leaf(ctx, 0, 17, Math.PI * .62, 11, colors.leaf); leaf(ctx, 0, 21, -Math.PI * .62, 11, colors.leaf);
        ctx.fillStyle = colors.petal; for (let i = 0; i < 8; i++) { petal(ctx, 0, 0, i * TAU / 8, 11, 3.2, false); ctx.fill(); }
        ctx.fillStyle = colors.center; ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, TAU); ctx.fill();
        ctx.fillStyle = colors.dot; for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + TAU / 16; ctx.beginPath(); ctx.arc(Math.cos(a) * 14.5, Math.sin(a) * 14.5, 1.1, 0, TAU); ctx.fill(); }
        ctx.restore(); };
      boota(S * .25, S * .22, 1); boota(S * .75, S * .72, 1);
      ctx.fillStyle = colors.dot; [[.75, .22], [.25, .72]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(S * x, S * y, 1.6, 0, TAU); ctx.fill();
        for (let i = 0; i < 4; i++) { const a = i * TAU / 4; ctx.beginPath(); ctx.arc(S * x + Math.cos(a) * 6, S * y + Math.sin(a) * 6, 1, 0, TAU); ctx.fill(); } });
    });
  }

  function bandhani(color, size = 28) {
    return tile(size, (ctx, S) => { ctx.strokeStyle = color; ctx.lineWidth = 1.2;
      [[.25, .25], [.75, .75]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(S * x, S * y, 3.2, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(S * x, S * y, .9, 0, TAU); ctx.fillStyle = color; ctx.fill(); });
    });
  }

  /* Paisley (ambi) with inner curls; 120x160 viewBox, stem at bottom-left. */
  function paisleySVG(color, extra = "") {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" ${extra}>
<path d="M28 150C-6 118 2 60 40 32 62 16 86 8 104 20c10 10-6 28-12 44-8 20 2 46-10 66-10 18-34 32-54 20z" fill="${color}" fill-opacity=".08"/>
<path d="M36 140C12 112 18 68 48 44c14-10 34-16 46-8 6 6-6 18-10 32-6 18 2 40-8 56-8 14-28 24-40 16z"/>
<path d="M50 122c-12-20-4-48 18-62 10-6 22-8 28-4 4 4-6 12-8 24-4 16 2 34-6 46-6 10-24 6-32-4z" stroke-dasharray="3 3"/>
<path d="M62 102c-4-10 0-24 10-30 6-4 12-2 12 2 2 6-8 8-8 16 0 6 4 10 0 14-4 2-10 2-14-2z"/>
<circle cx="72" cy="86" r="3" fill="${color}"/>
<path d="M104 20c8-10 20-6 14 6" /><path d="M40 32c-6-10-20-10-18 2"/>
<circle cx="112" cy="14" r="2.2" fill="${color}"/><circle cx="26" cy="28" r="2.2" fill="${color}"/>
<path d="M22 150c-6 2-10 6-8 10m14-8c-4 4-4 8-2 12m18-10c0 4 2 8 6 10" />
</svg>`;
  }

  /* Cusped (multifoil) arch for an SVG of size w x h: a scalloped semicircle on top, straight sides, closed along the bottom. */
  function archPath(w, h, cusps = 7) {
    const r = w / 2, cx = w / 2, bulge = r * 0.2, cy = r + bulge + 2;
    let d = `M0 ${h} L0 ${cy.toFixed(1)} `;
    for (let i = 0; i < cusps; i++) {
      const a0 = Math.PI + Math.PI * i / cusps, a1 = Math.PI + Math.PI * (i + 1) / cusps, am = (a0 + a1) / 2;
      const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
      const mx = cx + Math.cos(am) * (r + bulge), my = cy + Math.sin(am) * (r + bulge);
      d += `Q${mx.toFixed(1)} ${my.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)} `;
    }
    d += `L${w} ${h} Z`; return d;
  }

  return { mandala, toran, blockPrint, bandhani, paisleySVG, archPath, marigold, leaf };
})();

</script>
<script>
/* Shared renderer. Reads CONFIG, fills the markup, wires RSVP. Every template uses this unchanged. */
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const first = s => String(s).trim().split(/\s+/)[0];
  const parse = (d, t="00:00") => new Date(`${d}T${t}:00`);
  const fmtTime = t => { const [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; const hh = h%12||12; return m ? `${hh}:${String(m).padStart(2,"0")} ${ap}` : `${hh} ${ap}`; };
  const longDate = d => { const x = parse(d); return `${DAYS[x.getDay()]}, ${x.getDate()} ${MONTHS_LONG[x.getMonth()]} ${x.getFullYear()}`; };
  const stampD = d => { const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`; };
  /* Calendar span. With no end time the event is saved as 3 hours; the guest can adjust it. */
  const span = f => { const s = parse(f.date, f.time); let e = f.end ? parse(f.date, f.end) : new Date(s.getTime() + 3*36e5); if (e <= s) e = new Date(e.getTime() + 864e5); return [s, e]; };
  const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const cal = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const sideFromHash = () => { const h = location.hash.replace("#",""); return h === "bride" || h === "groom" ? h : null; };
  const setText = (id, txt) => { const el = $(id); el.textContent = txt || ""; el.hidden = !txt; };

  /* One size for both names, shrunk until the longer one fits its column. */
  function fitNames(){
    const ns = [...document.querySelectorAll(".names .n")];
    ns.forEach(n => { n.style.whiteSpace = "nowrap"; n.style.fontSize = ""; });
    const size = Math.max(26, Math.min(...ns.map(n => { const fs = parseFloat(getComputedStyle(n).fontSize), cw = n.clientWidth, sw = n.scrollWidth; return sw > cw && cw > 0 ? fs * cw / sw * .97 : fs; })));
    ns.forEach(n => n.style.fontSize = size + "px");
  }

  function render(){
    const side = sideFromHash() || CONFIG.side || "groom";
    const host = CONFIG[side], other = CONFIG[side === "groom" ? "bride" : "groom"];
    const fill = s => String(s||"").replace(/\{host\}/g, first(host.name)).replace(/\{other\}/g, first(other.name));
    const fns = CONFIG.functions.filter(f => f.side === "both" || f.side === side);
    const main = fns.find(f => /phera|wedding|shaadi|vivah|nikah/i.test(f.name)) || fns[fns.length-1];
    const f0 = fns[0], fN = fns[fns.length-1];
    document.documentElement.dataset.side = side;
    document.title = `${first(host.name)} & ${first(other.name)} · Wedding invitation`;

    $("previewBar").hidden = !CONFIG.preview;
    $("pvGroom").setAttribute("aria-current", side === "groom" ? "page" : "false");
    $("pvBride").setAttribute("aria-current", side === "bride" ? "page" : "false");

    $("blessing").innerHTML = esc(CONFIG.blessing) + (CONFIG.blessingEn ? `<small>${esc(CONFIG.blessingEn)}</small>` : "");
    $("eyebrow").innerHTML = CONFIG.intro;
    $("nameA").textContent = host.name; $("nameB").textContent = other.name;
    $("joiner").textContent = CONFIG.joiner || "and";
    $("lineA").innerHTML = (host.lineage||[]).map(esc).join("<br>");
    $("lineB").innerHTML = (other.lineage||[]).map(esc).join("<br>");
    $("mainDate").textContent = longDate(main.date);
    $("mainPlace").textContent = [main.venue, CONFIG.city].filter(Boolean).join(", ");

    $("inviteText").innerHTML = CONFIG.inviteText;
    setText("signWarm", CONFIG.signoff);
    setText("signFam", `${host.family} & ${other.family}`);
    setText("signCity", CONFIG.city);

    $("fnTitle").textContent = CONFIG.functionsTitle || "The functions";
    $("fnLead").textContent = fns.length === 1
      ? "Save it to your calendar so the evening isn't missed."
      : `${f0.date === fN.date ? "One day" : `${parse(f0.date).getDate()} to ${parse(fN.date).getDate()} ${MONTHS_LONG[parse(fN.date).getMonth()]}`}, ${fns.length} functions. Tap one to open the venue in Maps or add it to your calendar.`;

    const days = Math.ceil((parse(main.date, main.time) - Date.now())/864e5);
    $("countdown").innerHTML = days > 1 ? `<b>${days}</b><span>days to go</span>` : days === 1 ? `<b>1</b><span>day to go</span>` : days === 0 ? `<b>Today</b>` : `<b>Married</b><span>${Math.abs(days)} days ago</span>`;

    const gcal = f => { const [s, e] = span(f); const place = [f.venue, f.address, CONFIG.city].filter(Boolean).join(", ");
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`${f.name}: ${host.name} & ${other.name}`)}&dates=${stampD(s)}/${stampD(e)}&location=${encodeURIComponent(place)}&details=${encodeURIComponent(fill(f.body || f.note))}`; };
    $("timeline").innerHTML = fns.map(f => { const d = parse(f.date);
      const time = f.timeText || (fmtTime(f.time) + (f.end ? ` to ${fmtTime(f.end)}` : ""));
      const place = [f.venue, f.address].filter(Boolean).join(", ") || CONFIG.city;
      return `<li class="fn">
      <div class="when"><div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()]}</div></div>
      <div class="what">
        <h3>${esc(f.name)}${f.hindi ? `<span class="dn" lang="hi">${esc(f.hindi)}</span>` : ""}</h3>
        ${f.headline ? `<p class="headline">${esc(fill(f.headline))}</p>` : ""}
        ${f.body ? `<p class="evtext">${esc(fill(f.body))}</p>` : ""}
        <p class="meta"><b>${esc(time)}</b> · ${esc(place)}</p>
        ${f.note ? `<p class="note">${esc(fill(f.note))}</p>` : ""}
        ${f.dress ? `<p class="dress"><b>Wear</b>${esc(f.dress)}</p>` : ""}
        <div class="acts">
          ${f.map ? `<a class="chip" href="${esc(f.map)}" target="_blank" rel="noopener">${pin}Open in Maps</a>` : ""}
          <a class="chip" href="${gcal(f)}" target="_blank" rel="noopener">${cal}Add to calendar</a>
        </div>
      </div></li>`; }).join("");

    const travel = CONFIG.travel || [];
    $("venue").hidden = !travel.length;
    $("venueLead").textContent = CONFIG.venueLead || "";
    $("venueGrid").innerHTML = travel.map(t => `<div><h4>${esc(t.h)}</h4><p>${t.p}</p></div>`).join("");

    $("rsvp").hidden = !host.whatsapp;
    $("rPhone").textContent = host.whatsapp ? "+" + host.whatsapp : "";
    const keep = new Set([...document.querySelectorAll('#rFns input:checked')].map(i => i.value));
    const fresh = !$("rFns").children.length;
    $("rFns").innerHTML = fns.map((f,i) => `<label><input type="checkbox" name="fn" value="${esc(f.name)}" id="fn${i}" ${fresh || keep.has(f.name) ? "checked" : ""}>${esc(f.name)}</label>`).join("");

    setText("closingHindi", CONFIG.closingHindi); setText("closingLine", CONFIG.closingLine); setText("closingSig", CONFIG.closingSig);
    render.current = { side, host, other, fns };
    fitNames();
  }

  const form = $("rsvpForm");
  const buildMsg = () => {
    const { host, other } = render.current; const fd = new FormData(form); const fns = fd.getAll("fn");
    return [
      `RSVP for ${host.name} & ${other.name}'s wedding`,
      `Name: ${fd.get("name")||""}`,
      `Guests: ${fd.get("count")}`,
      fd.get("city") ? `Coming from: ${fd.get("city")}` : null,
      `Attending: ${fns.length ? fns.join(", ") : "Sadly can't make it"}`,
      fd.get("note") ? `Note: ${fd.get("note")}` : null
    ].filter(Boolean).join("\n");
  };
  form.addEventListener("input", () => { const p = $("rPreview"); p.hidden = !$("rName").value.trim(); p.textContent = buildMsg(); });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!$("rName").value.trim()) { $("rName").focus(); $("rName").placeholder = "We need your name first"; return; }
    const url = `https://wa.me/${render.current.host.whatsapp}?text=${encodeURIComponent(buildMsg())}`;
    const w = window.open(url, "_blank", "noopener"); if (!w) location.href = url;
  });
  $("copyPhone").addEventListener("click", async () => {
    const b = $("copyPhone"); const txt = "+" + render.current.host.whatsapp;
    try { await navigator.clipboard.writeText(txt); b.textContent = "copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("rPhone")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected, press copy"; }
    setTimeout(() => b.textContent = "copy number", 1800);
  });

  render();
  addEventListener("hashchange", render);
  addEventListener("resize", fitNames);
  if (document.fonts) document.fonts.ready.then(fitNames);
})();

</script>
<script>
(() => {
  const page = document.querySelector(".page"), opener = document.querySelector(".opener");
  document.documentElement.style.setProperty("--boota", `url(${ORN.blockPrint({ petal:"rgba(90,15,30,.28)", center:"rgba(243,220,143,.7)", leaf:"rgba(90,15,30,.35)", dot:"rgba(90,15,30,.4)" }, 96)})`);
  for (const c of ["tl","tr","bl","br"]) { const d = document.createElement("div"); d.className = "corner " + c; d.innerHTML = ORN.paisleySVG("#d9b25a"); d.setAttribute("aria-hidden","true"); page.appendChild(d); }
  const toran = document.createElement("canvas"); toran.className = "toran"; toran.setAttribute("aria-hidden","true"); page.insertBefore(toran, opener);
  const m = document.createElement("canvas"); m.className = "mandala"; m.setAttribute("aria-hidden","true"); opener.insertBefore(m, opener.firstChild);
  const draw = () => {
    ORN.toran(toran, { tassels: false, orange:"#e8912a", yellow:"#f6c35a" });
    const dpr = Math.min(devicePixelRatio || 1, 2); const s = m.clientWidth; m.width = s * dpr; m.height = s * dpr;
    const ctx = m.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,s,s);
    ORN.mandala(ctx, s/2, s/2, s*.48, "#d9b25a", { n: 12, lineWidth: 1.2 });
  };
  draw(); addEventListener("resize", draw); addEventListener("hashchange", () => setTimeout(draw)); if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
